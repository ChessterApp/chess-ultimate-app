  - name: "Sicilian Defense: Najdorf Variation, Poisoned Pawn Accepted"
    why: "the queen takes the b2 pawn and White gives up material for an attack"
  - name: "Sicilian Defense: Najdorf Variation, Polugaevsky Variation"
