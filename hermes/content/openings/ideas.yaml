# The idea of an opening, one line, next to the ECO book's name in the coach's board block (plan 31.10, package P8;
# owner: P8). Read by src/prompt_builder.opening_idea_line.
#
# The book (backend/data/openings/*.tsv) names lines and counts no games; it says nothing of what an opening is
# for. Without a line here the model made it up: «чёрные укрепляют пункт d5 пешкой, а не конём, как в ферзевом
# гамбите» (name-slav, 29.10: in the Queen's Gambit Declined the e-pawn holds d5), «6.Be3 — понятная игра без
# тактических осложнений» (move-najdorf: the English Attack is one of the sharpest lines), «логичнее не выводить
# коня под e5» about the Alekhine Defense (g1-resign: inviting e4-e5 is that opening's idea).
#
#   book   the ECO book's name: a family («Alekhine Defense») or a named line («Sicilian Defense: Najdorf
#          Variation»). The position's book name takes the longest entry that is that name or begins it (followed by
#          «:» or «,»), so a sub-line inherits its line's idea.
#   idea   one or two sentences in English, as the standard references give it; a move is written with its number.
#          A line's character (sharp, quiet, solid) is said only where every main reference says it.
#
# tests/unit/test_p8_1031.py checks every entry: the name is in the book, and every move sequence an idea quotes with
# its move number («4.O-O Nxe4 5.d4») is legal from one of that name's book positions.
ideas:
  - book: "Ruy Lopez"
    idea: "3.Bb5 attacks the knight that defends e5; White keeps a lasting pressure on e5 and the centre — a strategic opening whose main line goes 3...a6 4.Ba4 Nf6 5.O-O."
  - book: "Ruy Lopez: Berlin Defense"
    idea: "3...Nf6 counterattacks e4 at once; the main line 4.O-O Nxe4 5.d4 Nd6 6.Bxc6 dxc6 7.dxe5 Nf5 8.Qxd8+ Kxd8 trades queens early — a solid defence for Black."
  - book: "Italian Game"
    idea: "3.Bc4 aims the bishop at f7, the weak point next to Black's king, and gets ready to castle; White prepares a pawn centre with c3 and d4 or plays slowly with d3."
  - book: "Italian Game: Giuoco Piano"
    idea: "3...Bc5 develops the bishop toward f2 in the same way; White prepares d4 with 4.c3 or plays the slow 4.d3 (Giuoco Pianissimo)."
  - book: "Italian Game: Evans Gambit"
    idea: "4.b4 offers a pawn to deflect the c5 bishop and win time for c3 and d4: a sharp gambit for fast development and an attack."
  - book: "Italian Game: Two Knights Defense"
    idea: "3...Nf6 counterattacks e4 instead of developing the bishop; 4.Ng5 attacks f7 and leads to sharp play after 4...d5 5.exd5."
  - book: "Scotch Game"
    idea: "3.d4 opens the centre at once: after 3...exd4 4.Nxd4 White has free piece play and more space, and Black attacks the knight on d4."
  - book: "Petrov's Defense"
    idea: "2...Nf6 answers the attack on e5 with a counterattack on e4; after 3.Nxe5 Black first plays 3...d6, driving the knight back, and only then takes on e4 — a solid, symmetrical defence."
  - book: "Philidor Defense"
    idea: "2...d6 defends e5 with a pawn: a solid but passive set-up in which the d6 pawn shuts in the f8 bishop."
  - book: "King's Gambit Accepted"
    idea: "2.f4 offers the f-pawn to deflect the e5 pawn and open the f-file against f7; after 2...exf4 the play is sharp, and Black often holds the extra pawn with ...g5."
  - book: "King's Gambit Declined"
    idea: "Black does not take on f4 (2...Bc5 and 2...d5 are typical), keeps the centre and avoids the open f-file."
  - book: "Vienna Game"
    idea: "2.Nc3 develops and guards e4 before White chooses between f4 (the Vienna Gambit) and a slower plan with Bc4 or g3."
  - book: "Four Knights Game"
    idea: "Both sides develop the knights first; a solid, symmetrical opening in which 4.Bb5 (the Spanish Four Knights) and 4.d4 (the Scotch Four Knights) are the main tries for more."
  - book: "Bishop's Opening"
    idea: "2.Bc4 aims at f7 at once and keeps f2-f4 and d2-d4 in reserve; it often turns into the Italian Game or the Vienna Game."
  - book: "Center Game"
    idea: "2.d4 opens the centre at once; after 2...exd4 3.Qxd4 the queen comes out early and 3...Nc6 hits it, so Black gains time."
  - book: "Danish Gambit"
    idea: "3.c3 offers a pawn, often two, for a lead in development and open diagonals for both bishops toward f7 and g7: a sharp gambit."
  - book: "Sicilian Defense"
    idea: "1...c5 fights for d4 with the c-pawn instead of answering 1.e4 with 1...e5; after d4 and ...cxd4 Black has a half-open c-file and an extra central pawn, and the play is unbalanced."
  - book: "Sicilian Defense: Najdorf Variation"
    idea: "5...a6 takes b5 from the white pieces and prepares ...e5 or ...b5; one of the sharpest Sicilians. White's main sixth moves: 6.Bg5 (the main line, very sharp), 6.Be3 (the English Attack: f3, Qd2, O-O-O and a pawn storm with g4 — sharp, the kings castle on opposite sides), 6.Be2 (the Opocensky Variation, the quieter positional line), 6.Bc4, 6.f4, 6.h3."
  - book: "Sicilian Defense: Najdorf Variation, English Attack"
    idea: "White plays Be3, f3, Qd2 and O-O-O and storms the kingside with g4-g5: very sharp play with the kings castled on opposite sides."
  - book: "Sicilian Defense: Dragon Variation"
    idea: "Black fianchettoes the bishop on g7 along the long diagonal; against the Yugoslav Attack (Be3, f3, Qd2, O-O-O) the play is very sharp, with the kings on opposite sides and pawn storms."
  - book: "Sicilian Defense: Alapin Variation"
    idea: "2.c3 prepares d4 so that White can take back on d4 with a pawn and keep a pawn centre; Black usually answers 2...d5 or 2...Nf6."
  - book: "Sicilian Defense: Smith-Morra Gambit"
    idea: "2.d4 cxd4 3.c3 offers a pawn for quick development and open c- and d-files: a sharp gambit."
  - book: "French Defense"
    idea: "1...e6 prepares ...d5 and attacks White's centre; the price is the light-squared bishop on c8, shut in behind the e6 pawn."
  - book: "French Defense: Advance Variation"
    idea: "3.e5 gains space and cramps Black; Black attacks the base of the white pawn chain with ...c5, then ...Nc6 and ...Qb6 against d4."
  - book: "French Defense: Winawer Variation"
    idea: "3...Bb4 pins the c3 knight; after 4.e5 c5 5.a3 Bxc3+ 6.bxc3 White has the bishop pair and doubled c-pawns: sharp, unbalanced play."
  - book: "Caro-Kann Defense"
    idea: "1...c6 prepares ...d5 with the c-pawn, so the c8 bishop is not shut in as in the French Defense; a solid defence."
  - book: "Caro-Kann Defense: Advance Variation"
    idea: "3.e5 gains space; Black brings the c8 bishop out to f5 before ...e6 and attacks the white centre with ...c5."
  - book: "Scandinavian Defense"
    idea: "1...d5 attacks e4 at once; after 2.exd5 Black takes back with the queen (2...Qxd5, which 3.Nc3 hits) or plays 2...Nf6 first."
  - book: "Alekhine Defense"
    idea: "1...Nf6 attacks e4 and invites e4-e5: after 2.e5 the knight goes to d5 (2...Nd5), and Black attacks the advanced white pawns later with ...d6."
  - book: "Pirc Defense"
    idea: "Black lets White build a pawn centre with e4 and d4, develops with ...Nf6, ...d6, ...g6 and ...Bg7, and attacks the centre later."
  - book: "Modern Defense"
    idea: "1...g6 and ...Bg7 at once: Black lets White take the centre with pawns and attacks it later, keeping the g8 knight flexible."
  - book: "Queen's Gambit Declined"
    idea: "2...e6 defends d5 with the e-pawn: solid, but the c8 bishop is shut in behind e6; Black frees the game later with ...c5 or ...e5."
  - book: "Queen's Gambit Accepted"
    idea: "2...dxc4 gives up the centre for a while to develop freely; White usually wins the pawn back with e3 and Bxc4, and Black hits the centre with ...c5."
  - book: "Slav Defense"
    idea: "2...c6 defends d5 with the c-pawn, not with ...e6 as in the Queen's Gambit Declined, so the c8 bishop can still come out to f5 or g4."
  - book: "Semi-Slav Defense"
    idea: "Black plays both ...c6 and ...e6, a solid pawn triangle c6-d5-e6; the play turns sharp in the lines where Black takes on c4 and expands with ...b5 (the Meran, the Botvinnik)."
  - book: "Tarrasch Defense"
    idea: "3...c5 strikes at the centre at once; Black accepts an isolated d-pawn after cxd5 exd5 in return for free piece play."
  - book: "King's Indian Defense"
    idea: "Black lets White build a big pawn centre, fianchettoes the bishop on g7, castles and strikes back with ...e5 or ...c5; when the centre closes, each side attacks on its own wing."
  - book: "Nimzo-Indian Defense"
    idea: "3...Bb4 pins the c3 knight and fights for e4; Black is ready to give the bishop for the knight and double White's c-pawns."
  - book: "Queen's Indian Defense"
    idea: "3...b6 and ...Bb7 control e4 and d5 from a distance; a solid, flexible defence against 3.Nf3."
  - book: "Bogo-Indian Defense"
    idea: "3...Bb4+ checks to trade the dark-squared bishops or disturb White's development; a solid alternative to the Queen's Indian Defense."
  - book: "Grünfeld Defense"
    idea: "3...d5 lets White build a pawn centre after cxd5 Nxd5 e4 Nxc3 bxc3, and Black attacks it with ...Bg7, ...c5 and the pieces."
  - book: "Benoni Defense"
    idea: "Black meets d4-d5 with ...c5 and fights the advanced d5 pawn; in the Modern Benoni (...e6 and ...exd5) Black has a queenside pawn majority against White's central one — unbalanced, sharp play."
  - book: "Benko Gambit"
    idea: "3...b5 offers a pawn to open the a- and b-files; Black gets lasting pressure on the queenside for it."
  - book: "Dutch Defense"
    idea: "1...f5 controls e4 and prepares play on the kingside; it weakens the e8-h5 diagonal and the e6 square."
  - book: "English Opening"
    idea: "1.c4 fights for d5 from the flank; White often fianchettoes the f1 bishop (g3, Bg2) and plays a reversed Sicilian."
  - book: "Réti Opening"
    idea: "1.Nf3 and 2.c4 attack the centre from the flanks instead of occupying it with pawns, usually with a fianchetto on g2."
  - book: "Catalan Opening"
    idea: "3.g3 and Bg2 aim the bishop along the long diagonal at b7 and the queenside: the Queen's Gambit combined with a fianchetto."
  - book: "Queen's Pawn Game: London System"
    idea: "White sets up d4, Bf4, e3, Nf3, c3 and Bd3 against almost anything: a solid system with a fixed plan rather than a fight over theory."
  - book: "Trompowsky Attack"
    idea: "2.Bg5 attacks the f6 knight at once, ready to double Black's pawns with Bxf6, and avoids the main Indian theory."
  - book: "King's Indian Attack"
    idea: "White sets up Nf3, g3, Bg2, O-O, d3 and often e4 — a King's Indian Defense with the colours reversed; a system rather than a fixed line."
  - book: "Englund Gambit"
    idea: "1...e5 offers a pawn against 1.d4; after 2.dxe5 Black tries to win it back with ...Nc6 and ...Qe7. The gambit is objectively dubious: with simple development White keeps the pawn or a good game."
