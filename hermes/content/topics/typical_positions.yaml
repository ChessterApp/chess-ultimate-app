# Тематическая база тренера — раздел «Типовые позиции». Черновик 23.09.2026, правит методист.

- slug: carlsbad-structure
  phase: typical_position
  level: 3
  title_ru: Карлсбадская структура
  title_en: Carlsbad structure
  summary_ru: >-
    Возникает из разменного варианта ферзевого гамбита: белые пешки a2, b2, d4, e3 против
    a7, b7, c6, d5. Три плана у белых: атака меньшинства (b4–b5), игра в центре (f3 и e4)
    и атака на короля (Ne5, f4). У чёрных — контригра на королевском фланге (…Ne4, …f5),
    подрыв …c5 после подготовки или торможение …a5. Структура — учебник планирования:
    план выбирается по расположению фигур, а не по вкусу.
  summary_en: The Exchange QGD structure; White chooses between the minority attack, the e4 break and a kingside attack.
  key_ideas_ru:
    - Белым: пока чёрный конь не встал на e4, атака меньшинства — самый надёжный план.
    - Чёрным: конь на e4 и пешка f5 меняют игру; без этого ждите b4–b5.
    - Размен чернопольных слонов облегчает белым атаку меньшинства.
  typical_mistakes_ru:
    - Смешивать два плана и не довести ни один.
    - Чёрным допускать b5 без ...a5 и без контригры.
  lichess_themes: [middlegame]
  eco_codes: [D35, D36]
  lesson_stems: [карлсбад, carlsbad, разменн]
  positions:
    - title_ru: "Карлсбад: исходная расстановка"
      moves: "1. d4 d5 2. c4 e6 3. Nc3 Nf6 4. cxd5 exd5 5. Bg5 Be7 6. e3 O-O 7. Bd3 Nbd7 8. Qc2 c6 9. Nf3 Re8 10. O-O Nf8"
      plan_ru: "Белые: Rab1, b4, a4, b5. Чёрные: ...Ne4, ...Ng6, ...f5 или ...a5 и ...Be6–d5. Кто первым проведёт план, тот получит перевес."

- slug: hedgehog
  phase: typical_position
  level: 4
  title_ru: Ёж
  title_en: Hedgehog
  summary_ru: >-
    Чёрные пешки a6, b6, d6, e6 против белых пешек c4 и e4. Чёрные стоят компактно на
    трёх горизонталях, фигуры «свёрнуты» (Bb7, Be7, Nbd7, Qc7, Rc8, Rfe8) и ждут момента
    для подрывов …b5 или …d5. Белые владеют пространством и должны действовать
    осторожно: любая необоснованная активность взрывается контрударом. Ёж — позиция для
    терпеливых: ходы делаются «в темп», а не «в план».
  summary_en: Black sits on three ranks behind a6/b6/d6/e6 and waits for the ...b5 or ...d5 break.
  key_ideas_ru:
    - Чёрные: не спешить; ...b5 при поддержке a6 и Rc8, ...d5 при поддержке Bb7 и Nf6.
    - Белые: контроль над b5 и d5 (a4, Nd5?), профилактика важнее атаки.
    - Размен коня на слона b7 часто выгоден белым, размен ферзей — чёрным.
  typical_mistakes_ru:
    - Белым бросаться в атаку f4–f5 без контроля d5 и b5.
    - Чёрным подрывать ...b5 без подготовки и терять пешку.
  lichess_themes: [middlegame, quietMove]
  eco_codes: [A30, B44]
  lesson_stems: [ёж, еж, hedgehog]
  positions:
    - title_ru: Ёж из Английского начала
      moves: "1. c4 c5 2. Nf3 Nf6 3. Nc3 e6 4. g3 b6 5. Bg2 Bb7 6. O-O Be7 7. d4 cxd4 8. Qxd4 d6 9. Rd1 a6 10. b3 Nbd7"
      plan_ru: "Чёрные закончат ...Qc7, ...O-O, ...Rfe8 и будут ждать ...b5/...d5. Белые: e4, Bb2, Qe3 и контроль над b5."

- slug: maroczy-bind
  phase: typical_position
  level: 3
  title_ru: Зажим Мароци
  title_en: Maroczy bind
  summary_ru: >-
    Пешки белых c4 и e4 против чёрного фианкетто g6 в Сицилианской. Белые отнимают у чёрных
    поле d5 и продвижение …d5, получают пространство и играют медленно: Be3, Be2, O-O, f3,
    Qd2, Rfd1. Чёрные ищут разгрузку разменами (…Nxd4, …Bxc3 в некоторых линиях) и подрывы
    …b5 или …f5. Позиция учит играть «без хода соперника»: белые улучшают фигуры, пока
    чёрные ждут.
  summary_en: c4 + e4 against a Sicilian fianchetto; White takes d5 away and plays slowly.
  key_ideas_ru:
    - Белым: не разменивать фигур без выгоды, держать d5 и готовить b4 или f4 после подготовки.
    - Чёрным: разменять пару фигур (...Nxd4, ...Be6–c4) и подрывать ...b5.
    - Размен чернопольных слонов (...Bxc3) допустим только за структурную выгоду.
  typical_mistakes_ru:
    - Чёрным играть ...e5 и навсегда отдать d5.
    - Белым спешить с e5 или f4 без подготовки.
  lichess_themes: [middlegame]
  eco_codes: [B36, B37, B38]
  lesson_stems: [мароци, maroczy, зажим]
  positions:
    - title_ru: Зажим Мароци, основная позиция
      moves: "1. e4 c5 2. Nf3 Nc6 3. d4 cxd4 4. Nxd4 g6 5. c4 Bg7 6. Be3 Nf6 7. Nc3 O-O 8. Be2 d6 9. O-O"
      plan_ru: "Белые: f3, Qd2, Rac1, b3 — игра на пространстве. Чёрные: ...Nxd4, ...Be6, ...Qa5, ...Rfc8 и ...b5 при случае."

- slug: french-pawn-chain
  phase: typical_position
  level: 2
  title_ru: Французская цепь (d4–e5 против e6–d5)
  title_en: French pawn chain
  summary_ru: >-
    Закрытый центр, где цепь белых указывает на королевский фланг, а цепь чёрных — на
    ферзевый. Белые играют там, куда смотрит цепь: Bd3, Qg4, f4–f5, конь на e5 или g5.
    Чёрные атакуют основание d4 (…c5, …Qb6, …Nc6, …Nge7–f5) и готовят …f6 против вершины.
    Плохой слон c8 — главная забота чёрных: его выводят через d7–b5 или b6–a6.
  summary_en: Closed centre; each side plays where its chain points — White on the kingside, Black on the queenside.
  key_ideas_ru:
    - Основание цепи бьют пешкой (...c5), вершину — тоже пешкой (...f6), но позже.
    - Белым не спешить с f4–f5, пока d4 не защищён надёжно.
    - Размен белопольных слонов почти всегда облегчает чёрным жизнь.
  typical_mistakes_ru:
    - Чёрным играть ...f6 слишком рано и вскрыть собственного короля.
    - Белым брать на c5 (dxc5) и отдать центр.
  lichess_themes: [middlegame]
  eco_codes: [C02, C05, C11]
  lesson_stems: [французск, french, цеп]
  positions:
    - title_ru: Французская, вариант продвижения
      moves: "1. e4 e6 2. d4 d5 3. e5 c5 4. c3 Nc6 5. Nf3 Qb6 6. a3 Nh6 7. b4 cxd4 8. cxd4 Nf5"
      plan_ru: "Чёрные давят на d4 конём f5 и ферзём; белые защищают центр (Bb2, Be2) и ищут игру на королевском фланге."

- slug: opposite-side-castling
  aliases: ["разносторонние рокировки", "гонка атак"]
  phase: typical_position
  level: 3
  title_ru: Разносторонние рокировки
  title_en: Opposite-side castling
  summary_ru: >-
    Короли на разных флангах — гонка атак. Пешки бросают вперёд без оглядки: они не
    ослабляют собственного короля. Побеждает не тот, кто атакует красивее, а тот, кто
    быстрее: считайте темпы, вскрывайте линии жертвами пешек (h5–h4–h3 против g6, g4–g5
    против Nf6) и не тратьте ходов на защиту, если можно ответить угрозой на угрозу.
    Размен атакующих фигур соперника или блокировка его пешек — единственная законная
    «защита».
  summary_en: Kings on opposite wings — a race; count tempi, throw pawns, open files with sacrifices.
  key_ideas_ru:
    - Каждый ход — либо угроза, либо ускорение атаки; защитные ходы только при прямой угрозе мата.
    - Вскрывайте линию к чужому королю жертвой пешки, не жалея.
    - Размен ферзей обычно выгоден тому, чья атака медленнее.
  typical_mistakes_ru:
    - Тратить темпы на «профилактику» и проиграть гонку.
    - Двигать пешки перед своим королём, когда атака соперника уже вскрыла линии.
  lichess_themes: [kingsideAttack, queensideAttack, attackingF2F7, sacrifice]
  eco_codes: [B76, B78, B99]
  lesson_stems: [разносторон, opposite, рокировк]
  positions:
    - title_ru: Югославская атака в Драконе
      moves: "1. e4 c5 2. Nf3 d6 3. d4 cxd4 4. Nxd4 Nf6 5. Nc3 g6 6. Be3 Bg7 7. f3 O-O 8. Qd2 Nc6 9. Bc4 Bd7 10. O-O-O"
      plan_ru: "Белые: h4–h5, Bh6, размен слона g7 и мат по линии h. Чёрные: ...Rc8, ...Ne5–c4, жертва качества на c3 и давление на b2."
  model_games:
    - {white: "Kasparov", black: "Topalov", year: 1999, note_ru: "Вейк-ан-Зее: короли на разных флангах и жертва ладьи на d4 с маршем короля через всю доску."}

- slug: king-in-the-centre
  aliases: ["король застрял в центре", "нерокированный король"]
  phase: typical_position
  level: 2
  title_ru: Король в центре
  title_en: King stuck in the centre
  summary_ru: >-
    Если соперник задержал рокировку, откройте центр любой ценой: жертва пешки за линию e
    или d окупается атакой на короля, который не успевает уйти. Ладья на e1, ферзь и
    фигуры бьют по e-линии; шахи по диагонали a4–e8 или h5–e8 мешают рокировке. Правило:
    против короля в центре не разменивайте ферзей и не закрывайте центр.
  summary_en: If the enemy king has not castled, open the centre — even with a pawn sacrifice.
  key_ideas_ru:
    - Вскрывайте центр пешечным прорывом (e5, d5, f4–f5) или жертвой.
    - Ладья на открытую линию к королю, ферзь на линию шахов.
    - Не давайте сопернику времени: каждый ход — угроза.
  typical_mistakes_ru:
    - Держать короля в центре ради «выигрыша пешки».
    - Атакующему меняться ферзями и снимать давление.
  lichess_themes: [attackingF2F7, exposedKing]
  lesson_stems: [центр, корол, king in the centre]
  model_games:
    - {white: "Morphy", black: "Duke of Brunswick and Count Isouard", year: 1858, note_ru: "Париж: чёрный король остаётся в центре, и все фигуры белых бьют по линиям d и e."}
