# Тематическая база тренера — раздел «Миттельшпиль». Черновик 23.09.2026, правит методист.

- slug: planning-from-the-pawn-structure
  phase: middlegame
  level: 3
  title_ru: План по пешечной структуре
  title_en: Planning from the pawn structure
  summary_ru: >-
    План — это ответ на вопрос «что делать следующие пять ходов», и подсказывает его
    структура пешек. Открытая линия — ладьи туда. Пешечная цепь — играть на фланге, куда
    она смотрит. Изолятор — атака или блокада. Меньшинство на фланге — атака меньшинства.
    Сначала оцените: материал, безопасность королей, активность фигур, структуру; затем
    выберите план, который улучшает вашу худшую фигуру или бьёт по слабости соперника.
  summary_en: The pawn structure tells you where to play; evaluate, then pick a plan that fits it.
  key_ideas_ru:
    - Порядок оценки: короли → материал → активность → структура → план.
    - Один план за раз; менять план — только если структура изменилась.
    - Слабость соперника фиксируется прежде, чем атакуется.
  typical_mistakes_ru:
    - Ходить «по ощущениям» без вопроса «какая слабость у соперника?».
    - Начинать атаку на короля, когда структура требует игры на другом фланге.
  lichess_themes: [middlegame, quietMove]
  lesson_stems: [план, planning, структур, оцен]
  positions:
    - title_ru: Выбор плана в карлсбадской структуре
      moves: "1. d4 d5 2. c4 e6 3. Nc3 Nf6 4. cxd5 exd5 5. Bg5 Be7 6. e3 O-O 7. Bd3 Nbd7 8. Qc2 c6 9. Nf3 Re8 10. O-O Nf8"
      plan_ru: "Структура подсказывает белым атаку меньшинства (b4–b5), чёрным — игру на королевском фланге (...Ne4, ...f5). Задача ученика: назвать план обеих сторон до того, как ходить."

- slug: attack-on-the-king
  aliases: ["греческий дар", "greek gift", "жертва на h7", "жертва слона на h7", "матовая атака"]
  phase: middlegame
  level: 3
  title_ru: Атака на короля
  title_en: Attack on the king
  summary_ru: >-
    Атака оправдана, когда у вас больше фигур рядом с чужим королём, чем у соперника
    защитников, и есть способ вскрыть линии. Три условия: перевес сил на участке, слабости
    в пешечном прикрытии (h6, g6, f6 или отсутствие защитника вроде коня f6), и невозможность
    контригры соперника в центре. Типичные приёмы: жертва слона на h7 («греческий дар»),
    пешечный штурм при разносторонних рокировках, перевод ладьи через третью горизонталь.
  summary_en: Attack when you have more pieces near the king than the opponent has defenders — and a way to open lines.
  key_ideas_ru:
    - Посчитайте атакующих и защитников; при равенстве атака не проходит.
    - Закрытый центр — разрешение на фланговую атаку; открытый центр — сначала контроль центра.
    - Жертва вскрывает короля только когда остальные фигуры готовы подключиться за один-два хода.
  typical_mistakes_ru:
    - Атаковать одной-двумя фигурами.
    - Жертвовать раньше, чем подведены резервы.
  lichess_themes: [kingsideAttack, attackingF2F7, sacrifice, mate]
  eco_codes: [C14, B78]
  lesson_stems: [атак, attack, король]
  positions:
    - title_ru: Расстановка для греческого дара (Bxh7+)
      moves: "1. e4 e6 2. d4 d5 3. Nc3 Nf6 4. Bg5 Be7 5. e5 Nfd7 6. Bxe7 Qxe7 7. f4 O-O 8. Nf3 c5 9. Bd3"
      plan_ru: "Слон d3, конь f3 (идёт на g5), ферзь готов к h5, конь f6 разменян. Если чёрные ошибутся (например, 9...cxd4?), появляется Bxh7+ Kxh7 Ng5+ с матовой атакой. Условия «греческого дара»: слон бьёт h7, конь достаёт g5, ферзь выходит на h5, у чёрных нет защитника f6."
  model_games:
    - {white: "Rotlewi", black: "Rubinstein", year: 1907, note_ru: "Лодзь: «бессмертная Рубинштейна» — все фигуры чёрных бьют по королю, жертвы ладьи и слона."}

- slug: exchanges-and-simplification
  aliases: ["когда меняться", "размен ферзей", "упрощение"]
  phase: middlegame
  level: 2
  title_ru: Размены и упрощение
  title_en: Exchanges and simplification
  summary_ru: >-
    Каждый размен меняет оценку. Правило материала: с лишней фигурой меняйте фигуры, но
    не пешки; с меньшим материалом — наоборот. Правило качества: меняйте свою плохую
    фигуру на хорошую фигуру соперника. Правило атаки: атакующий не меняет атакующих
    фигур, защищающийся стремится к разменам, особенно ферзей. Перед каждым разменом
    спросите: кто после него стоит лучше?
  summary_en: Trade pieces when ahead in material, trade your bad pieces for good ones, avoid trades when attacking.
  key_ideas_ru:
    - Лишняя фигура: меняйте фигуры, сохраняйте пешки.
    - Размен ферзей — почти всегда переход в эндшпиль; проверьте, готов ли ваш король.
    - Не соглашайтесь на размен «по инерции»: отказ от размена часто сильнее.
  typical_mistakes_ru:
    - Менять активную фигуру на пассивную.
    - Упрощать позицию, имея инициативу.
  lichess_themes: [middlegame, endgame]
  lesson_stems: [размен, упрощ, exchange, simplif]

- slug: transition-to-the-endgame
  phase: middlegame
  level: 3
  title_ru: Переход в эндшпиль
  title_en: Transition to the endgame
  summary_ru: >-
    Переходить в эндшпиль стоит, когда там есть конкретный плюс: лучшая структура, более
    активный король, лишняя пешка, лучший слон. Перед разменом ферзей оцените пешечную
    структуру и активность королей: в эндшпиле король — сильная фигура, и тот, чей король
    ближе к центру, обычно выигрывает время. Плохой переход — из атаки с инициативой в
    равный эндшпиль.
  summary_en: Trade down only into an endgame where you hold a concrete plus — structure, king activity, an extra pawn.
  key_ideas_ru:
    - Перед разменом ферзей: чей король активнее, чья структура лучше, чьи пешки дальше?
    - Слон против коня в эндшпиле с пешками на обоих флангах — плюс слону.
    - Отдалённая проходная и здоровое большинство — веские причины упрощать.
  typical_mistakes_ru:
    - Менять ферзей «чтобы не рисковать» и попадать в худший эндшпиль.
    - Держать короля в углу после размена ферзей.
  lichess_themes: [endgame]
  lesson_stems: [переход, эндшпил, transition]

- slug: two-weaknesses
  aliases: ["две слабости", "вторая слабость"]
  phase: middlegame
  level: 4
  title_ru: Принцип двух слабостей
  title_en: The principle of two weaknesses
  summary_ru: >-
    Одну слабость обычно можно защитить. Поэтому сильная сторона создаёт вторую — на
    другом фланге — и переключается между ними: фигуры атакующего переходят быстрее, чем
    защитника. Так реализуется большинство перевесов: зафиксировать слабость, привязать к
    ней фигуры соперника, затем прорыв на другом участке. Это главный технический приём
    в эндшпиле и позиционном миттельшпиле.
  summary_en: One weakness can be held; create a second one on the other wing and switch between them.
  key_ideas_ru:
    - Сначала зафиксируйте первую слабость, чтобы она никуда не делась.
    - Вторая слабость создаётся пешечным прорывом на другом фланге.
    - Переключайтесь, когда фигуры соперника привязаны к первой слабости.
  typical_mistakes_ru:
    - Долбить одну слабость, которую соперник надёжно защитил.
    - Прорываться раньше, чем первая слабость зафиксирована.
  lichess_themes: [endgame, middlegame]
  lesson_stems: [двух слабост, two weaknesses, слабост]
