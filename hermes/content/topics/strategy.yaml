# Тематическая база тренера — раздел «Стратегия». Черновик 23.09.2026, правит методист.

- slug: center-control
  phase: strategy
  level: 1
  title_ru: Центр и контроль центра
  title_en: Control of the centre
  summary_ru: >-
    Поля d4, e4, d5, e5 — центр. Фигура в центре бьёт больше полей и быстро переводится на
    любой фланг, поэтому борьба за центр начинается с первого хода. Центр держат пешками
    (классический подход: e4 и d4) или фигурами издалека (гипермодерн: слоны на g2/b2,
    удары c5, f5 по чужим пешкам). Кто владеет центром, тот выбирает, где играть.
  summary_en: The four central squares decide piece activity; hold them with pawns or pressure them with pieces.
  key_ideas_ru:
    - Пешечный центр силён, пока его защищают фигуры; без поддержки он становится мишенью.
    - Против пешечного центра играют подрывы: c5, f5 против e4/d4, e5 против d4.
    - Открытый центр — фигуры важнее пешек, темпы решают; закрытый центр — время на фланговые планы.
  typical_mistakes_ru:
    - Ходы крайними пешками (a3, h3) в дебюте вместо борьбы за центр.
    - Отдавать центр разменом пешек без плана давления на него.
  lichess_themes: [opening, middlegame]
  eco_codes: [B90, C60, E60]
  lesson_stems: [центр, centre, center]
  positions:
    - title_ru: Пешечный центр белых против давления чёрных (Сицилианская)
      moves: "1. e4 c5 2. Nf3 d6 3. d4 cxd4 4. Nxd4 Nf6 5. Nc3"
      plan_ru: "У белых пешка e4 в центре и перевес в пространстве; чёрные получили полуоткрытую линию c и будут давить на e4 и c3. Типичная асимметрия: пространство против контригры."

- slug: piece-activity
  phase: strategy
  level: 2
  title_ru: Активность фигур
  title_en: Piece activity
  summary_ru: >-
    Сила фигуры зависит от места, а не от номинала: конь на краю бьёт два поля, в центре —
    восемь; ладья на закрытой линии бесполезна, на открытой — доминирует. Оценивая позицию,
    сравните каждую свою фигуру с её визави: чья лучше? Плохую фигуру улучшают переводом,
    разменивают или открывают для неё линию. Правило Капабланки: сначала улучши худшую фигуру.
  summary_en: A piece is worth what it does; improve your worst piece before starting an attack.
  key_ideas_ru:
    - «Худшая фигура» — первая цель плана: перевод коня на форпост, слона на длинную диагональ.
    - Активная ладья на седьмой горизонтали или открытой линии стоит пешки.
    - Размен активной фигуры соперника на свою пассивную — выгодная сделка.
  typical_mistakes_ru:
    - Держать слона за собственной пешечной цепью («плохой слон») без попытки его вывести.
    - Начинать атаку, когда часть фигур ещё не участвует.
  lichess_themes: [middlegame, quietMove]
  lesson_stems: [активн, фигур, activity]
  model_games:
    - {white: "Karpov", black: "Kasparov", year: 1985, note_ru: "Матч, партия 16: чёрный конь на d3 («осьминог») парализует всю позицию белых."}

- slug: outpost
  phase: strategy
  level: 2
  title_ru: Форпост
  title_en: Outpost
  summary_ru: >-
    Поле в лагере соперника, защищённое своей пешкой и недоступное для чужих пешек. Конь на
    форпосте (d5, e5, d6) — одна из сильнейших фигур в миттельшпиле: его нельзя прогнать, он
    давит на обе стороны доски, и сопернику часто приходится отдавать за него слона или
    ладью. Форпост возникает после продвижения или размена чужой пешки, которая
    контролировала поле.
  summary_en: A square in the enemy camp protected by your pawn and unreachable by enemy pawns — ideal for a knight.
  key_ideas_ru:
    - Ищите «дыры»: поля перед отсталыми или сдвоенными пешками соперника.
    - Сначала обеспечьте поле (разменяйте защитника, поставьте пешку), потом ведите коня.
    - Против форпоста — разменять коня слоном, даже ценой пары слонов.
  typical_mistakes_ru:
    - Двигать пешки вперёд и оставлять за ними дыры (d5 после ...e5 и ...c5 в Сицилианской).
    - Отдавать слона за коня на форпосте слишком рано, пока конь ещё не занял поле.
  lichess_themes: [middlegame]
  eco_codes: [B33, B90]
  lesson_stems: [форпост, outpost, дыр]
  positions:
    - title_ru: Конь на d5 в Свешникове
      moves: "1. e4 c5 2. Nf3 Nc6 3. d4 cxd4 4. Nxd4 e5 5. Nb5 d6 6. N1c3 a6 7. Na3 b5 8. Nd5"
      plan_ru: "Ходы ...e5 и ...d6 оставили дыру на d5; конь занял её, и его нельзя прогнать пешкой. Чёрные будут играть ...Nxd5 или ...Be6, чтобы разменять коня."

- slug: bishop-pair
  phase: strategy
  level: 2
  title_ru: Два слона
  title_en: The bishop pair
  summary_ru: >-
    Два слона вместе контролируют поля обоих цветов и в открытой позиции сильнее, чем слон
    с конём или два коня. Сторона с двумя слонами стремится вскрыть позицию, разменять
    пешки в центре и отгонять коней от опорных полей. Сторона без слонов ищет закрытую
    структуру, форпосты для коней и размен одного из слонов.
  summary_en: Two bishops dominate open positions; the side with them opens the game, the other side closes it.
  key_ideas_ru:
    - Два слона — долгосрочный перевес: он растёт по мере разменов и вскрытия линий.
    - Стройте пешки так, чтобы у соперника не было устойчивых полей для коней.
    - Прежде чем менять слона на коня, спросите, что вы получаете взамен: структуру, время, форпост.
  typical_mistakes_ru:
    - Бить коня слоном без конкретной причины («чтобы сдвоить пешки»), теряя пару слонов.
    - Держать позицию закрытой, имея двух слонов.
  lichess_themes: [middlegame, endgame]
  eco_codes: [C68, E32]
  lesson_stems: [два слона, пара слон, bishop pair]
  positions:
    - title_ru: Разменный вариант Испанской — пара слонов за структуру
      moves: "1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 4. Bxc6 dxc6"
      plan_ru: "Чёрные получили двух слонов, белые — лучшую пешечную структуру (4 против 3 на королевском фланге) и надежду на эндшпиль. Чёрные должны играть на вскрытие и активность слонов."

- slug: good-and-bad-bishop
  aliases: ["плохой слон", "хороший слон", "bad bishop"]
  phase: strategy
  level: 2
  title_ru: Хороший и плохой слон
  title_en: Good and bad bishop
  summary_ru: >-
    Слон, у которого собственные пешки стоят на полях его цвета, «плохой»: он упирается в них
    и не имеет диагоналей. Слон другого цвета «хороший». Оценивать слонов нужно по
    фиксированным пешкам в центре. Плохого слона лечат тремя способами: вывести за цепь
    (в Французской — на a6 через b6), разменять или переставить пешки на другой цвет.
  summary_en: A bishop blocked by its own pawns on its colour is bad; free it, trade it, or move the pawns.
  key_ideas_ru:
    - Ставьте пешки на поля цвета, противоположного своему слону.
    - «Плохой слон защищает хорошие пешки» — иногда плохой слон нужен для защиты цепи.
    - Разменивайте плохого слона на хорошего слона соперника при первой возможности.
  typical_mistakes_ru:
    - Фиксировать пешки на цвете своего слона без нужды.
    - Менять хорошего слона на коня, оставляя себе плохого.
  lichess_themes: [middlegame, endgame]
  eco_codes: [C02]
  lesson_stems: [плох, хорош, слон, bad bishop, good bishop]
  positions:
    - title_ru: Плохой слон c8 во Французской
      moves: "1. e4 e6 2. d4 d5 3. e5 c5 4. c3 Nc6 5. Nf3 Qb6"
      plan_ru: "Пешки d5 и e6 на белых полях запирают слона c8. План чёрных — ...Bd7, ...Rc8 и давление на d4, а слона выводить через d7–b5 или b6–a6."

- slug: open-files-and-seventh-rank
  phase: strategy
  level: 2
  title_ru: Открытые линии и седьмая горизонталь
  title_en: Open files and the seventh rank
  summary_ru: >-
    Ладьи нужны линии без пешек. Первый, кто займёт открытую линию ладьёй и удвоит на ней
    фигуры, получает вход в лагерь соперника — обычно на седьмую (вторую) горизонталь.
    Ладья на седьмой нападает на пешки и запирает короля на последней линии; две ладьи на
    седьмой — почти всегда решающее преимущество. Полуоткрытая линия (без своей пешки)
    даёт давление на чужую пешку.
  summary_en: Rooks need open files; the reward is invasion on the seventh rank.
  key_ideas_ru:
    - Занимайте открытую линию первым и удваивайте ладьи, если соперник может оспорить её.
    - Если линию оспаривают, контролируйте поле вторжения (d7/e7), а не саму линию.
    - Ладья на седьмой плюс проходная пешка — стандартный выигрыш в эндшпиле.
  typical_mistakes_ru:
    - Разменивать ладьи на открытой линии, когда у вас более активные фигуры.
    - Открывать линию для соперника собственными разменами пешек.
  lichess_themes: [rookEndgame, middlegame]
  lesson_stems: [открыт, лини, седьм, seventh, open file]
  positions:
    - title_ru: Ладья на седьмой горизонтали
      fen: "r5k1/pp3ppp/8/8/8/6P1/PP3P1P/3R2K1 w - - 0 1"
      plan_ru: "1.Rd7 — ладья нападает на b7 и f7 и приковывает короля к восьмой горизонтали; ладья a8 вынуждена пассивно защищать b7. Активность против пассивности."
      best_move: Rd7
  model_games:
    - {white: "Capablanca", black: "Tartakower", year: 1924, note_ru: "Нью-Йорк: ладья на седьмой и марш короля через g5–h6 решают ладейный эндшпиль."}

- slug: weak-squares-and-colour-complexes
  phase: strategy
  level: 3
  title_ru: Слабые поля и слабый цвет
  title_en: Weak squares and colour complexes
  summary_ru: >-
    Слабое поле — то, которое уже не защитить пешкой. Несколько слабых полей одного цвета
    (например, после размена чернопольного слона и пешек на g6–f6) образуют слабый
    комплекс: фигуры соперника садятся на эти поля навсегда. Особенно опасен слабый цвет
    вокруг короля. Слабые поля создаются пешечными ходами, поэтому каждый ход пешкой —
    решение навсегда.
  summary_en: Squares your pawns can no longer defend; a whole colour complex weakens when the matching bishop is gone.
  key_ideas_ru:
    - Перед ходом пешкой спросите: какие поля я перестаю защищать?
    - Разменяв слона определённого цвета, берегите поля этого цвета у своего короля.
    - Заняв слабое поле конём или ферзём, не спешите — оно не убежит.
  typical_mistakes_ru:
    - Фианкетто без слона: после размена слона g7 поля f6, h6 становятся дырами.
    - Ходы ...h6 и ...g5 у собственного короля ради атаки на слона.
  lichess_themes: [middlegame, kingsideAttack]
  lesson_stems: [слаб, пол, цвет, weak square]

- slug: prophylaxis
  phase: strategy
  level: 3
  title_ru: Профилактика
  title_en: Prophylaxis
  summary_ru: >-
    Прежде чем проводить свой план, спросите: «что хочет соперник?» — и помешайте этому.
    Профилактический ход не создаёт угрозы, но отнимает у соперника его лучший ход:
    контроль поля прорыва, отход короля из-под будущего шаха, форточка заранее. Сильные
    игроки тратят на профилактику половину ходов; это то, что отличает «игру по позиции»
    от игры «по своим угрозам».
  summary_en: Ask what the opponent wants and prevent it before pursuing your own plan.
  key_ideas_ru:
    - После хода соперника ищите его угрозу и его план, а не только свой ответ.
    - Лучший момент для профилактики — когда у соперника есть один-единственный хороший план.
    - Профилактика не пассивность: часто это тихий ход, после которого план соперника не работает вовсе.
  typical_mistakes_ru:
    - Играть «свою игру», не замечая подготовленного прорыва соперника.
    - Тратить темпы на защиту от угроз, которых нет.
  lichess_themes: [quietMove, defensiveMove]
  eco_codes: [E32]
  lesson_stems: [профилакт, prophyla]
  positions:
    - title_ru: Профилактический ход ферзём в Нимцовиче
      moves: "1. d4 Nf6 2. c4 e6 3. Nc3 Bb4 4. Qc2"
      plan_ru: "Чёрные грозят ...Bxc3+ со сдвоением пешек. 4.Qc2 заранее защищает c3 ферзём, чтобы после размена бить ферзём и сохранить структуру. Ход не создаёт угрозы — он отнимает план."
  model_games:
    - {white: "Petrosian", black: "Spassky", year: 1966, note_ru: "Матч, партия 10: серия профилактических ходов и жертва качества."}

- slug: space-advantage
  phase: strategy
  level: 3
  title_ru: Пространство
  title_en: Space advantage
  summary_ru: >-
    Продвинутые пешки дают фигурам больше полей, а сопернику — меньше: его фигуры мешают
    друг другу и не могут быстро перебросить защиту. Пространственный перевес используют
    не спеша: улучшают фигуры, готовят прорыв там, где соперник не успеет собрать защиту, и
    избегают лишних разменов — тесной стороне размены помогают. Обратная сторона: далеко
    ушедшие пешки могут стать слабостями в эндшпиле.
  summary_en: Advanced pawns give your pieces room and take it from the opponent; avoid exchanges, prepare a break.
  key_ideas_ru:
    - Со пространством не меняйтесь: сопернику тесно, пусть остаётся тесно.
    - Готовьте прорыв на том фланге, куда соперник не успевает перебросить фигуры.
    - Тесной стороне нужны размены и подрывы пешечной цепи.
  typical_mistakes_ru:
    - Спешить с прорывом, не переведя фигуры.
    - Допускать освобождающие размены соперника (например, ...d5 или ...c5 в тесной позиции).
  lichess_themes: [middlegame]
  eco_codes: [B36, E90]
  lesson_stems: [пространств, space, теснот]
  positions:
    - title_ru: Зажим Мароци
      moves: "1. e4 c5 2. Nf3 Nc6 3. d4 cxd4 4. Nxd4 g6 5. c4"
      plan_ru: "Пешки c4 и e4 отнимают у чёрных поле d5 и продвижение ...d5. Белые играют медленно: Be3, Be2, O-O, f3, Qd2 и не разменивают фигур; чёрные ищут ...b5 или ...f5."

- slug: initiative-vs-material
  phase: strategy
  level: 3
  title_ru: Инициатива против материала
  title_en: Initiative versus material
  summary_ru: >-
    Инициатива — право делать угрозы, на которые соперник обязан отвечать. Пешка или
    качество за инициативу — нормальная сделка, если угрозы продолжаются и фигуры
    соперника не успевают развиться. Ценность материала растёт со временем: чем дольше
    инициатива не превращается в мат или возврат материала, тем ближе поражение. Поэтому
    после жертвы играют форсированно и не позволяют консолидации.
  summary_en: Material can be traded for the right to make threats — but only while the threats keep coming.
  key_ideas_ru:
    - Жертвуйте, когда сможете назвать следующие три угрозы.
    - Владея инициативой, не меняйте атакующие фигуры на защищающие.
    - Имея лишний материал, отдавайте часть назад, чтобы погасить инициативу соперника.
  typical_mistakes_ru:
    - Держаться за лишнюю пешку и получить мат.
    - Жертвовать «на общих основаниях» без конкретных вариантов.
  lichess_themes: [sacrifice, attackingF2F7, kingsideAttack]
  eco_codes: [C52, D20]
  lesson_stems: [инициатив, initiative, жертв]
  positions:
    - title_ru: Гамбит Эванса — пешка за темпы и центр
      moves: "1. e4 e5 2. Nf3 Nc6 3. Bc4 Bc5 4. b4"
      plan_ru: "После 4...Bxb4 5.c3 и d4 белые получают центр и опережение в развитии за пешку. Чёрным нужно вернуть пешку и закончить развитие, а не удерживать материал."
  model_games:
    - {white: "Morphy", black: "Duke of Brunswick and Count Isouard", year: 1858, note_ru: "Париж: развитие с темпами и жертвы ради инициативы — образец на все времена."}
