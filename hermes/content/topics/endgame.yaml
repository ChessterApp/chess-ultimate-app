# Тематическая база тренера — раздел «Эндшпиль». Черновик 23.09.2026, правит методист.

- slug: king-activity
  phase: endgame
  level: 1
  title_ru: Активный король
  title_en: King activity
  summary_ru: >-
    После размена ферзей король перестаёт быть слабостью и становится фигурой силой около
    трёх пешек. Первое правило эндшпиля: король идёт в центр. Он защищает свои пешки,
    нападает на чужие и поддерживает проходную. Кто первым централизует короля, тот
    обычно и выигрывает темп в борьбе за слабости.
  summary_en: After the queens go, the king is a fighting piece — centralise it first.
  key_ideas_ru:
    - Первый ход в эндшпиле — часто ход королём к центру.
    - Король впереди своей проходной сильнее, чем позади.
    - Считайте, чей король ближе к пешкам противника.
  typical_mistakes_ru:
    - Оставлять короля на g1/g8 после размена ферзей.
    - Идти королём к пешкам соперника, бросая свои.
  lichess_themes: [endgame, kingEndgame]
  lesson_stems: [корол, king, активн]
  positions:
    - title_ru: "Оппозиция: король ведёт пешку"
      fen: "8/8/4k3/8/4K3/4P3/8/8 b - - 0 1"
      plan_ru: "Ход чёрных, оппозицию держат белые: на 1...Kd6 2.Kf5, на 1...Kf6 2.Kd5, и белый король проходит вперёд, пешка идёт следом. При ходе белых та же позиция — ничья."

- slug: opposition-and-key-squares
  aliases: ["оппозиция", "ключевые поля", "король и пешка против короля"]
  phase: endgame
  level: 1
  title_ru: Оппозиция и ключевые поля
  title_en: Opposition and key squares
  summary_ru: >-
    В окончании король и пешка против короля всё решает оппозиция: короли друг напротив
    друга через одно поле, и тот, кто должен ходить, уступает дорогу. У пешки есть ключевые
    поля (для пешки на e3 — d5, e5, f5; чем дальше пешка, тем ближе к ней поля): если
    король нападающей стороны занимает ключевое поле, пешка проходит независимо от
    очереди хода. Пешка идёт вперёд только тогда, когда король уже обеспечил дорогу.
  summary_en: In K+P v K the side that holds the opposition or reaches a key square wins; the pawn goes last.
  key_ideas_ru:
    - Король впереди пешки, пешка сзади: сначала король занимает ключевое поле.
    - Ход пешкой — часто способ передать очередь хода и получить оппозицию.
    - Слабейшая сторона держит оппозицию и стоит перед пешкой; ладейная пешка почти всегда ничья.
  typical_mistakes_ru:
    - Двигать пешку вперёд, пока король не обеспечил ключевое поле.
    - Слабейшей стороне уходить королём в сторону вместо позиции перед пешкой.
  lichess_themes: [pawnEndgame, kingEndgame, zugzwang]
  lesson_stems: [оппозиц, ключев, opposition, key square, пешечн]
  positions:
    - title_ru: Оппозиция при ходе чёрных — белые выигрывают
      fen: "8/8/4k3/8/4K3/4P3/8/8 b - - 0 1"
      plan_ru: "1...Kd6 2.Kf5 Ke7 3.Ke5 Kd7 4.Kf6 Kd6 5.e4 Kd7 6.e5 Ke8 7.Ke6 — король занял ключевое поле, пешка пройдёт. При ходе белых: 1.Kd4 Kd6 2.e4 Ke6 3.e5 Ke7! 4.Kd5 Kd7 — ничья."
    - title_ru: Квадрат пешки
      fen: "8/8/8/8/P3k3/8/8/7K w - - 0 1"
      plan_ru: "Ход белых: 1.a5 — квадрат пешки a5–a8–d8–d5, король e4 в него не попадает, пешка проходит. При ходе чёрных 1...Kd5 входит в квадрат и догоняет пешку."
      best_move: a5

- slug: lucena-position
  aliases: ["мост", "позиция лусены", "building a bridge"]
  phase: endgame
  level: 3
  title_ru: Позиция Лусены («мост»)
  title_en: Lucena position
  summary_ru: >-
    Ладья и пешка против ладьи: пешка на седьмой горизонтали, король сильнейшей стороны
    перед ней на восьмой, чужой король отрезан ладьёй хотя бы на одну линию. Выигрыш
    достигается «постройкой моста»: ладья ставится на четвёртую горизонталь, король
    выходит из-под пешки, и после серии шахов ладья закрывает короля от шахов. Это
    важнейшая выигранная позиция ладейного эндшпиля — без неё лишняя пешка не реализуется.
  summary_en: "Rook + pawn on the 7th v rook: win by building a bridge with the rook on the 4th rank."
  key_ideas_ru:
    - Ладья на четвёртую горизонталь (Rc4), затем король выходит.
    - На шахи король идёт к ладье: Kb6, Kc6, Kb5 — и ладья закрывает (Rb4).
    - Не пешка коневая или ладейная? Тогда мост работает; ладейная пешка — особый случай.
  typical_mistakes_ru:
    - Выходить королём без подготовленного моста и получать вечный шах.
    - Ставить ладью на пятую или шестую горизонталь — мост не строится.
  lichess_themes: [rookEndgame, endgame]
  lesson_stems: [лусен, мост, lucena, bridge, ладейн]
  positions:
    - title_ru: Позиция Лусены
      fen: "1K6/1P1k4/8/8/8/8/r7/2R5 w - - 0 1"
      plan_ru: "1.Rc4! Ra1 2.Kc7 Rc1+ 3.Kb6 Rb1+ 4.Kc6 Rc1+ 5.Kb5 Rb1+ 6.Rb4 — мост построен, пешка проходит."
      best_move: Rc4

- slug: philidor-position
  aliases: ["защита филидора", "третья горизонталь"]
  phase: endgame
  level: 3
  title_ru: Позиция Филидора (защита по третьей горизонтали)
  title_en: Philidor position
  summary_ru: >-
    Ладья против ладьи с пешкой: слабейшая сторона держит короля перед пешкой, а ладью — на
    третьей горизонтали (шестой от соперника), не пуская чужого короля вперёд. Как только
    пешка встаёт на ту же горизонталь, ладья уходит на первую и шахует сзади: король
    нападающего не может спрятаться, потому что пешка отняла его укрытие. Ничья, которую
    обязан знать каждый.
  summary_en: "Rook v rook + pawn: keep the king in front of the pawn and the rook on the third rank until the pawn advances, then check from behind."
  key_ideas_ru:
    - Король перед пешкой, ладья на третьей горизонтали — ждать.
    - Пешка пошла на шестую — ладья на первую, шахи сзади.
    - Не давать чужому королю дойти до шестой горизонтали, пока пешка сзади.
  typical_mistakes_ru:
    - Шаховать сбоку раньше времени и пустить короля вперёд.
    - Уходить королём от пешки в сторону.
  lichess_themes: [rookEndgame, endgame, defensiveMove]
  lesson_stems: [филидор, philidor, третьей горизонтал, ладейн]
  positions:
    - title_ru: Защита Филидора
      fen: "4k3/R7/1r6/3K4/4P3/8/8/8 b - - 0 1"
      plan_ru: "Чёрные ждут: 1...Rc6 или 1...Rh6, не пуская короля на шестую. После e5 и e6 ладья переходит на первую горизонталь (…Rb1) и шахует с тыла — королю негде укрыться."

- slug: rook-behind-the-passed-pawn
  phase: endgame
  level: 2
  title_ru: Ладья позади проходной
  title_en: Rook behind the passed pawn
  summary_ru: >-
    Правило Тарраша: ладья должна стоять позади проходной пешки — своей, чтобы толкать её,
    и чужой, чтобы тормозить. Ладья перед пешкой связана: каждый шаг пешки отнимает у неё
    поля, а ладья сзади с каждым шагом становится активнее. В ладейных окончаниях
    активность ладьи важнее пешки: часто стоит отдать пешку, чтобы ладья вышла из
    пассивной позиции.
  summary_en: Rooks belong behind passed pawns — yours to push them, the opponent's to stop them.
  key_ideas_ru:
    - Ладья сзади проходной, король к пешке.
    - Пассивная ладья — почти поражение; ищите активность даже ценой пешки.
    - Отрезайте чужого короля от проходной по линии.
  typical_mistakes_ru:
    - Защищать пешку ладьёй спереди или сбоку.
    - Держаться за пешку ценой пассивной ладьи.
  lichess_themes: [rookEndgame, advancedPawn]
  lesson_stems: [ладья за проходн, позади, behind, ладейн]
  positions:
    - title_ru: Ладья за проходной, король идёт к пешке
      fen: "r5k1/5ppp/8/P7/8/8/5PPP/R5K1 w - - 0 1"
      plan_ru: "1.a6 и король белых идёт на b7 через f1–e2–d3–c4–b5. Чёрная ладья привязана к a8; король чёрных не успевает."
      best_move: a6

- slug: basic-checkmates
  phase: endgame
  level: 1
  title_ru: Элементарные маты (ферзём, ладьёй)
  title_en: Basic checkmates
  summary_ru: >-
    Мат одинокому королю ферзём или ладьёй ставится по одной схеме: оттеснить короля на
    край доски, подвести своего короля и дать мат на краю. Ферзь отнимает поля «ходом
    коня» от чужого короля, не давая шахов, пока не подойдёт свой король. Ладьёй —
    оппозиция королей и шах по краю. Главная опасность — пат: перед каждым ходом
    проверяйте, остались ли у короля соперника ходы.
  summary_en: Drive the king to the edge, bring your king up, mate on the edge; beware of stalemate.
  key_ideas_ru:
    - Ферзь встаёт на расстояние хода коня от короля соперника и повторяет, отнимая поля.
    - Свой король подходит к чужому, пока тот прижат к краю; мат — только с поддержкой короля.
    - Ладьёй: оппозиция королей, шах по краю, король оттесняется на одну линию.
  typical_mistakes_ru:
    - Пат при мате ферзём.
    - Бесцельные шахи вместо оттеснения.
  lichess_themes: [mate, queenEndgame, rookEndgame]
  lesson_stems: [мат ферз, мат лад, элементарн, basic mate, checkmate]
  positions:
    - title_ru: Ферзь и король против короля
      fen: "8/8/8/4k3/8/8/8/3QK3 w - - 0 1"
      plan_ru: "1.Qd3 (или Qb3) — ферзь на расстоянии хода коня, король чёрных теснится к краю; затем Ke2–e3–f4 и мат на восьмой горизонтали. Следить за патом."
    - title_ru: Ладья и король против короля
      fen: "8/8/8/4k3/8/8/8/R3K3 w - - 0 1"
      plan_ru: "1.Ra4 — отрезать короля по четвёртой горизонтали, затем Ke2–e3, оппозиция и шах ладьёй, шаг за шагом к краю."

- slug: wrong-bishop
  aliases: ["не тот слон", "неправильный слон", "ладейная пешка и слон"]
  phase: endgame
  level: 2
  title_ru: «Не тот» слон и ладейная пешка
  title_en: Wrong bishop
  summary_ru: >-
    Слон и крайняя пешка против короля — ничья, если слон не контролирует поле превращения
    и король слабейшей стороны успевает в угол. Из угла его не выгнать: ни слон, ни пешка не
    отнимают угловое поле, а попытка оттеснить королём даёт пат. Проверьте цвет поля
    превращения и цвет слона до размена фигур.
  summary_en: Bishop + rook pawn v king is a draw if the bishop does not control the queening square and the king reaches the corner.
  key_ideas_ru:
    - Перед разменом в эндшпиль с крайней пешкой сравните цвет слона и поля превращения.
    - Слабейшая сторона бежит королём в угол превращения.
    - Сильнейшая сторона может выиграть, только не пустив короля в угол.
  typical_mistakes_ru:
    - Разменивать всё до слона и ладейной пешки, не проверив цвет.
    - Слабейшей стороне идти королём к пешке вместо угла.
  lichess_themes: [bishopEndgame, endgame]
  lesson_stems: [не тот слон, ладейн пешк, wrong bishop, слон]
  positions:
    - title_ru: Не тот слон — ничья
      fen: "7k/8/8/6KP/8/3B4/8/8 w - - 0 1"
      plan_ru: "Слон d3 белопольный, поле h8 чёрное. Король чёрных в углу: 1.Kg6 Kg8 2.h6 Kh8 3.h7 — пат. Выигрыша нет."

- slug: pawn-breakthrough
  aliases: ["пешечный прорыв", "прорыв пешек"]
  phase: endgame
  level: 2
  title_ru: Пешечный прорыв
  title_en: Pawn breakthrough
  summary_ru: >-
    Жертва одной или двух пешек, после которой оставшаяся пешка становится проходной и не
    догоняется королём. Работает, когда чужой король далеко: считайте квадрат для
    будущей проходной, а не для той, что стоит сейчас. Классика — три пешки против трёх на
    пятой горизонтали: центральная пешка идёт вперёд, и любая реакция оставляет проходную.
  summary_en: Sacrifice pawns so that the last one becomes an unstoppable passed pawn.
  key_ideas_ru:
    - Проверяйте прорыв всякий раз, когда ваши пешки продвинуты дальше чужих.
    - Считайте квадрат для пешки, которая появится после прорыва.
    - Прорыв — оружие и защиты: отвлечь короля от своей проходной.
  typical_mistakes_ru:
    - Не видеть прорыва соперника и пускать пешки вперёд.
    - Делать прорыв, когда чужой король в квадрате.
  lichess_themes: [pawnEndgame, promotion, sacrifice]
  lesson_stems: [прорыв, breakthrough, пешечн]
  positions:
    - title_ru: Классический прорыв трёх пешек
      fen: "7k/ppp5/8/PPP5/8/8/8/7K w - - 0 1"
      plan_ru: "1.b6! axb6 2.c6! bxc6 3.a6 — проходная a; или 1...cxb6 2.a6! bxa6 3.c6 — проходная c. Король чёрных далеко, пешка проходит."
      best_move: b6

- slug: zugzwang
  phase: endgame
  level: 2
  title_ru: Цугцванг
  title_en: Zugzwang
  summary_ru: >-
    Положение, в котором любой ход ухудшает позицию, а пропустить ход нельзя. В эндшпиле
    цугцванг — основной способ выиграть: ходов у соперника мало, и очередь хода становится
    обузой. Чтобы передать очередь хода, используют запасные пешечные ходы, треугольник
    королём и выжидательные ходы ладьёй. В миттельшпиле цугцванг редок — слишком много
    ходов.
  summary_en: Every move worsens the position; in endgames losing the move is how you win — or lose.
  key_ideas_ru:
    - Считайте запасные темпы пешек у обеих сторон.
    - Треугольник королём — способ потерять темп в пешечном окончании.
    - Прежде чем зафиксировать пешки, проверьте, у кого останутся запасные ходы.
  typical_mistakes_ru:
    - Тратить пешечные темпы раньше времени.
    - Не замечать, что после размена ходов у соперника не остаётся.
  lichess_themes: [zugzwang, pawnEndgame]
  lesson_stems: [цугцванг, zugzwang, темп]
  positions:
    - title_ru: Оппозиция как цугцванг
      fen: "8/8/4k3/8/4K3/4P3/8/8 b - - 0 1"
      plan_ru: "Чёрные в цугцванге: любой ход королём уступает дорогу белому королю. Та же позиция при ходе белых — уже белые «в цугцванге» и должны отдать оппозицию; спасает только запасной пешечный ход, которого здесь нет."

- slug: bishop-vs-knight
  phase: endgame
  level: 3
  title_ru: Слон против коня
  title_en: Bishop versus knight
  summary_ru: >-
    Слон сильнее при пешках на обоих флангах и в открытой позиции: он действует на обе
    стороны, поддерживает проходную издалека и тормозит чужую. Конь сильнее в закрытой
    позиции, при пешках на одном фланге и когда есть форпост: он бьёт поля обоих цветов и
    проходит через блокированные цепи. Плохой слон (упирается в свои пешки) хуже коня;
    конь на краю доски хуже любого слона.
  summary_en: Bishop for open positions and both wings; knight for closed positions, one wing and outposts.
  key_ideas_ru:
    - Пешки на двух флангах → слон; на одном → конь.
    - Со слоном ставьте пешки на другой цвет и вскрывайте позицию.
    - С конём фиксируйте пешки на цвете чужого слона и ищите форпост.
  typical_mistakes_ru:
    - Переходить в эндшпиль «конь против слона» с пешками на обоих флангах.
    - Ставить свои пешки на цвет своего слона.
  lichess_themes: [bishopEndgame, knightEndgame, endgame]
  lesson_stems: [слон против кон, bishop, knight, лёгкие фигур]
