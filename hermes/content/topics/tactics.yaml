- slug: fork
  phase: tactics
  level: 1
  title_ru: Вилка (двойной удар)
  title_en: Fork
  summary_ru: >-
    Одна фигура нападает сразу на две и больше целей. Защитить обе за один ход обычно
    нельзя, поэтому одна из них теряется. Самая частая вилка — конём, потому что его
    удар не блокируется и не совпадает с линиями других фигур; пешечная вилка выигрывает
    фигуру, ферзевая вилка чаще всего сочетает шах и нападение на незащищённую фигуру.
  summary_en: One piece attacks two or more targets at once; usually one of them is lost.
  key_ideas_ru:
    - Ищите незащищённые фигуры соперника и поля, с которых ваша фигура достаёт до двух из них.
    - Вилка с шахом — самая сильная: соперник обязан ответить на шах, а не спасать фигуру.
    - Конь бьёт по полям одного цвета — король и ферзь на полях одного цвета часто под угрозой.
    - Перед вилкой полезно завлечь фигуру на нужное поле разменом или шахом.
  typical_mistakes_ru:
    - Ставить короля и ферзя (или ладью) на расстоянии хода коня друг от друга.
    - Оставлять фигуры незащищёнными — вилка почти всегда бьёт по «висячим» фигурам.
    - Считать только собственную вилку и не замечать ответную.
  lichess_themes: [fork, knightEndgame]
  lesson_stems: [вилк, двойн, fork]
  positions:
    - title_ru: Вилка конём на короля и ладью
      fen: "r3k3/8/8/3N4/8/8/8/4K3 w - - 0 1"
      plan_ru: "1.Nc7+ — шах королю и одновременно нападение на ладью a8. После отхода короля конь забирает ладью."
      best_move: Nc7+
  model_games:
    - {white: "Fischer", black: "Spassky", year: 1972, note_ru: "Партия 3 матча: конь на h5/f4 и удары по двум целям."}

- slug: pin
  phase: tactics
  level: 1
  title_ru: Связка
  title_en: Pin
  summary_ru: >-
    Дальнобойная фигура (слон, ладья, ферзь) нападает на фигуру, за которой на той же линии
    стоит более ценная. Если сзади король — связка абсолютная, связанная фигура не может
    ходить по правилам. Если сзади ферзь или ладья — связка относительная: ход возможен, но
    стоит материала. Связанная фигура плохо защищает и сама становится мишенью: на неё
    можно нападать ещё раз пешкой или другой фигурой.
  summary_en: A long-range piece attacks a piece that shields a more valuable one behind it.
  key_ideas_ru:
    - Связанную фигуру атакуйте повторно — она не может уйти.
    - Связка по диагонали слоном на g5/b5 — типичный дебютный приём против коней f6/c6.
    - Развязка: отойти с шахом, закрыться, разменять связывающую фигуру или увести ценную фигуру.
    - Относительная связка иногда мнимая: связанная фигура ходит с шахом или с угрозой мата.
  typical_mistakes_ru:
    - Ходить «связанной» фигурой в относительной связке, не посчитав, что теряется сзади.
    - Ослаблять поля вокруг короля пешками (h6, g5), отгоняя связывающего слона.
  lichess_themes: [pin]
  lesson_stems: [связк, pin]
  positions:
    - title_ru: Слон g5 связывает коня f6 с ферзём d8
      moves: "1. d4 d5 2. c4 e6 3. Nc3 Nf6 4. Bg5"
      plan_ru: "Конь f6 связан относительно ферзя. Чёрные обычно развязываются ходом Be7; выпад ...Ne4 нужно считать: после Bxe7 Qxe7 связка снята разменом."
  model_games:
    - {white: "Alekhine", black: "Nimzowitsch", year: 1930, note_ru: "Сан-Ремо: «пушка Алехина» — три фигуры в батарее по связанной линии c."}

- slug: skewer
  phase: tactics
  level: 1
  title_ru: Сквозной удар (рентген)
  title_en: Skewer
  summary_ru: >-
    Обратная связка: дальнобойная фигура нападает на ценную фигуру, а за ней на той же линии
    стоит менее ценная. Ценная фигура вынуждена уйти, и вторая теряется. Чаще всего сквозной
    удар с шахом: король отходит, а стоявший за ним ферзь или ладья погибает. Типичен в
    эндшпиле с ладьями и в позициях, где король и ферзь оказались на одной линии.
  summary_en: A line attack on a valuable piece that exposes a less valuable piece behind it.
  key_ideas_ru:
    - Король и ферзь (ладья) на одной линии — сигнал искать шах по этой линии.
    - В ладейных окончаниях сквозной удар по горизонтали — частый способ выиграть пешку или ладью.
    - Заставить короля встать на линию с фигурой можно шахом или жертвой.
  typical_mistakes_ru:
    - Отходить королём на одну линию со своим ферзём.
    - Забывать, что удар возможен и по диагонали слоном, не только ладьёй.
  lichess_themes: [skewer, xRayAttack]
  lesson_stems: [сквозн, рентген, skewer]
  positions:
    - title_ru: Шах по пятой горизонтали и выигрыш ферзя
      fen: "8/8/8/1q2k3/8/8/8/4K2R w - - 0 1"
      plan_ru: "1.Rh5+ — король должен уйти с линии, и ладья забирает ферзя b5."
      best_move: Rh5+

- slug: discovered-attack
  phase: tactics
  level: 2
  title_ru: Открытое нападение и открытый шах
  title_en: Discovered attack
  summary_ru: >-
    Фигура отходит и открывает линию своей дальнобойной фигуре. Получаются два удара за один
    ход: открывшая линию фигура нападает сама, а стоявшая сзади — по открытой линии. Если
    открывается шах, отходящая фигура может забрать что угодно: соперник обязан отвечать на
    шах. Двойной шах (шахуют обе фигуры) отбивается только ходом короля.
  summary_en: A piece moves away and unmasks an attack by a long-range piece behind it.
  key_ideas_ru:
    - Ищите батарею «своя дальнобойная фигура — своя фигура впереди — цель соперника».
    - Отходящая фигура должна создать вторую угрозу, иначе удар половинчатый.
    - Открытый шах даёт отходящей фигуре «бесплатный» ход — забирайте самое дорогое.
    - Двойной шах — сильнейшая форма: закрыться и побить нельзя, только ходить королём.
  typical_mistakes_ru:
    - Ставить короля или ферзя на линию с чужой дальнобойной фигурой, даже если между ними стоит чужая фигура.
    - Не проверять, что отходящая фигура сама не бьётся с темпом.
  lichess_themes: [discoveredAttack, doubleCheck]
  lesson_stems: [открыт, вскрыт, discovered, двойной шах]
  positions:
    - title_ru: Двойной шах конём и слоном с выигрышем ферзя
      fen: "3q3k/8/8/4N3/8/8/1B6/4K3 w - - 0 1"
      plan_ru: "1.Nf7+ — конь шахует с f7 и открывает слона b2 по диагонали до h8: двойной шах. Король уходит, и конь забирает ферзя d8."
      best_move: Nf7+
    - title_ru: Открытое нападение на ферзя
      fen: "3q3k/6pp/8/1b6/3N4/8/5PPP/3RR1K1 w - - 0 1"
      plan_ru: "1.Nxb5 — конь забирает слона и открывает ладью d1 на ферзя d8. Ферзь обязан уйти, слон потерян: два удара за один ход."
      best_move: Nxb5

- slug: back-rank-mate
  aliases: ["мат на последней горизонтали", "слабая первая горизонталь", "форточка"]
  phase: tactics
  level: 1
  title_ru: Мат по последней горизонтали
  title_en: Back-rank mate
  summary_ru: >-
    Король после рокировки заперт собственными пешками f, g, h. Ладья или ферзь на последней
    горизонтали ставит мат, если её некому побить. Отсюда два правила: сделайте «форточку»
    (h3 или g3) вовремя и не уводите последнюю фигуру, защищающую первую горизонталь.
    Многие комбинации — отвлечение защитника именно от последней горизонтали.
  summary_en: A king boxed in by its own pawns is mated on the back rank by a rook or queen.
  key_ideas_ru:
    - Считайте защитников последней горизонтали у себя и у соперника перед каждым разменом.
    - Отвлечение (жертва ферзя или ладьи) — главный способ убрать последнего защитника.
    - Форточка стоит темп, но без неё нельзя менять тяжёлые фигуры спокойно.
  typical_mistakes_ru:
    - Забирать «подвешенную» фигуру и оставлять первую горизонталь без защиты.
    - Делать форточку слишком поздно, когда соперник уже владеет открытой линией.
  lichess_themes: [backRankMate, mateIn1, mateIn2]
  lesson_stems: [последн, горизонтал, back rank, мат]
  positions:
    - title_ru: Ладья ставит мат по восьмой горизонтали
      fen: "6k1/5ppp/8/8/8/8/5PPP/4R1K1 w - - 0 1"
      plan_ru: "1.Re8# — король заперт пешками f7, g7, h7, защитников у восьмой горизонтали нет."
      best_move: Re8#

- slug: smothered-mate
  aliases: ["спертый мат", "наследие филидора"]
  phase: tactics
  level: 2
  title_ru: Спёртый мат
  title_en: Smothered mate
  summary_ru: >-
    Конь ставит мат королю, который окружён собственными фигурами и пешками и не имеет
    ни одного поля. Классическая схема — «наследие Филидора»: ферзь жертвуется на g8
    (или g1), чтобы ладья закрыла последнее поле, и конь даёт мат с f7 (f2). Схема
    возникает в углу после рокировки, когда король зажат ладьёй и пешками.
  summary_en: A knight mates a king smothered by its own pieces; often after a queen sacrifice on g8.
  key_ideas_ru:
    - Ищите позиции, где у короля в углу нет полей, а конь достаёт до f7/h7 (f2/h2).
    - Жертва ферзя на g8 с завлечением ладьи — стандартный финал; сначала проверьте, что ладья обязана брать.
    - Открытый шах конём с d5 или e5 на f7 часто ведёт к спёртому мату через двойной шах.
  typical_mistakes_ru:
    - Ставить ладью на f8/g8 рядом с королём в углу при чужом коне поблизости.
    - Не считать промежуточный ход: между шахами соперник может закрыться фигурой.
  lichess_themes: [smotheredMate, mate]
  lesson_stems: [спёрт, сперт, smothered]
  positions:
    - title_ru: Конь ставит спёртый мат
      fen: "6rk/6pp/8/6N1/8/8/8/4K3 w - - 0 1"
      plan_ru: "1.Nf7# — король h8 заперт ладьёй g8 и пешками g7, h7."
      best_move: Nf7#

- slug: deflection-and-decoy
  aliases: ["перегрузка", "перегруженный защитник", "отвлечение", "завлечение"]
  phase: tactics
  level: 2
  title_ru: Отвлечение и завлечение
  title_en: Deflection and decoy
  summary_ru: >-
    Два родственных приёма. Отвлечение: фигуру соперника заставляют покинуть важное поле
    или линию, обычно жертвой, после чего рушится защита (мат по последней горизонтали,
    потеря фигуры). Завлечение: фигуру соперника, чаще короля или ферзя, заставляют встать
    на нужное поле, где она попадает под вилку, связку или мат. Оба приёма — «перегрузка»
    защитника: он не может выполнить две задачи сразу.
  summary_en: Force a defender off its post (deflection) or a piece onto a bad square (decoy).
  key_ideas_ru:
    - Найдите фигуру, которая защищает два объекта сразу, — это перегруженный защитник.
    - Жертва на поле, которое эта фигура обязана бить, снимает одну из защит.
    - Завлечение короля под шах с последующей вилкой — типичный финал в эндшпиле.
  typical_mistakes_ru:
    - Поручать одной фигуре защиту сразу нескольких слабостей.
    - Брать жертву автоматически, не спросив «а что она защищала?».
  lichess_themes: [deflection, attraction, capturingDefender]
  lesson_stems: [отвлеч, завлеч, deflection, decoy]
  positions:
    - title_ru: Перегруженная ладья — отвлечение от восьмой горизонтали
      fen: "3r2k1/3n1ppp/8/8/Q7/8/5PPP/4R1K1 w - - 0 1"
      plan_ru: "Ладья d8 защищает и коня d7, и поле e8. 1.Qxd7! — если 1...Rxd7, то 2.Re8#; если не брать, белые остались с лишним конём."
      best_move: Qxd7
  model_games:
    - {white: "Réti", black: "Bogoljubov", year: 1924, note_ru: "Нью-Йорк: Bf7+ завлекает короля, и ладья ставит мат по восьмой."}
    - {white: "Adams", black: "Torre", year: 1920, note_ru: "Новый Орлеан: серия ходов ферзём отвлекает защитников поля e8."}

- slug: removing-the-defender
  phase: tactics
  level: 2
  title_ru: Уничтожение защитника
  title_en: Removing the defender
  summary_ru: >-
    Если объект (пешка, поле, король) держится одной фигурой, эту фигуру можно разменять или
    побить, и объект падает. Часто это размен коня f6, защищающего h7 и d5, или слона,
    охраняющего ключевое поле перед матовой атакой. Считать надо два хода вперёд:
    «бью защитника — что после взятия?».
  summary_en: Capture or exchange the piece that guards a key square, pawn or the king.
  key_ideas_ru:
    - Перед атакой перечислите, кто защищает цель, и кого из защитников можно снять с темпом.
    - Размен защитника с шахом или с нападением не даёт сопернику перегруппироваться.
    - Уничтожение защитника пешки — самый простой способ выиграть материал в миттельшпиле.
  typical_mistakes_ru:
    - Разменивать «просто так» фигуру, которая держала важное поле у собственного короля.
    - Не видеть, что после взятия защитника взявшая фигура сама попадает под удар.
  lichess_themes: [capturingDefender, sacrifice]
  lesson_stems: [защитник, уничтож, defender]
  positions:
    - title_ru: Размен коня f6 перед атакой на короля
      moves: "1. d4 d5 2. c4 e6 3. Nc3 Nf6 4. Bg5 Be7 5. e3 O-O 6. Nf3 Nbd7 7. Bd3 c6 8. O-O dxc4 9. Bxc4 Nd5 10. Bxe7 Qxe7"
      plan_ru: "Конь f6 — главный защитник королевского фланга. В подобных структурах белые стремятся разменять его (Bxf6 или ход e4 с оттеснением), чтобы открыть дорогу к h7 и e6."

- slug: zwischenzug
  aliases: ["промежуточный шах", "цвишенцуг"]
  phase: tactics
  level: 3
  title_ru: Промежуточный ход
  title_en: Zwischenzug
  summary_ru: >-
    Вместо ожидаемого ответа (взятия, отхода) делается другой ход с более сильной угрозой —
    шах или нападение на ферзя, — и лишь потом выполняется взятие. Соперник считал размен
    равным, а в итоге теряет темп или материал. Промежуточный шах — самая частая форма.
  summary_en: An unexpected in-between move (often a check) before the expected recapture.
  key_ideas_ru:
    - После каждого взятия соперника спросите: «обязан ли я брать обратно прямо сейчас?».
    - Промежуточный шах меняет порядок ходов и часто выигрывает темп.
    - Проверяйте промежуточные ходы соперника в своих расчётах — это главный источник просмотров.
  typical_mistakes_ru:
    - Считать вариант «бью — берут — бью» без проверки шахов между ходами.
    - Оставлять короля на открытой линии в момент серии разменов.
  lichess_themes: [intermezzo]
  lesson_stems: [промежуточ, zwischenzug, intermezzo]

- slug: opening-traps
  aliases: ["детский мат", "мат легаля", "ловушки"]
  phase: tactics
  level: 1
  title_ru: Дебютные ловушки и как их не пропустить
  title_en: Opening traps
  summary_ru: >-
    Ловушка — ход, который выглядит естественно, но проигрывает форсированно. Классика:
    детский мат (ферзь и слон на f7), мат Легаля (жертва ферзя ради мата слоном и конями),
    ловушка в дебюте четырёх коней. Против ловушек помогает не память, а привычка: после
    каждого хода соперника проверять шахи, взятия и угрозы на f7/f2.
  summary_en: Natural-looking moves that lose by force; check every check, capture and threat.
  key_ideas_ru:
    - Поле f7 (f2) — самое слабое в начале партии: его защищает только король.
    - Ранний выход ферзя соперника — сигнал искать, куда он нацелен, и развиваться с темпом.
    - Жертва в дебюте — всегда проверяйте, не ведёт ли взятие к мату или потере ферзя.
  typical_mistakes_ru:
    - Брать «зевнутого» ферзя не посчитав, чем закончится взятие.
    - Ходить пешками g и h в ответ на выпад ферзя вместо развития фигур.
  lichess_themes: [opening, mateIn2, mateIn3]
  eco_codes: [C20, C50, C57]
  lesson_stems: [ловушк, детский мат, легал, trap]
  positions:
    - title_ru: Мат Легаля
      moves: "1. e4 e5 2. Nf3 d6 3. Bc4 Bg4 4. Nc3 g6 5. Nxe5 Bxd1 6. Bxf7+ Ke7 7. Nd5#"
      plan_ru: "Чёрные взяли ферзя и получили мат: слон c4, кони e5 и d5. Правильно было 5...dxe5 — не брать ферзя, а бить коня."
    - title_ru: Защита от детского мата
      moves: "1. e4 e5 2. Qh5 Nc6 3. Bc4 g6 4. Qf3 Nf6"
      plan_ru: "Угроза Qxf7# отражена дважды: g6 отогнало ферзя, Nf6 закрыло f7 и развивает фигуру. Ферзь белых будет терять темпы."
