# Тематическая база тренера — раздел «Дебют». Черновик 23.09.2026, правит методист.

- slug: opening-principles
  phase: opening
  level: 1
  title_ru: Принципы дебюта
  title_en: Opening principles
  summary_ru: >-
    Три задачи дебюта: занять или взять под контроль центр, вывести лёгкие фигуры, спрятать
    короля рокировкой и соединить ладьи. Каждый ход должен решать одну из задач или мешать
    сопернику. Не ходите одной фигурой дважды без нужды, не выводите ферзя рано, не берите
    пешки ценой отставания в развитии. Дебют «по принципам» без знания теории даёт
    нормальную позицию к 12-му ходу.
  summary_en: Centre, development, king safety — one of the three with every move.
  key_ideas_ru:
    - Пешки в центр (e4/d4 или e5/d5), кони до слонов, рокировка к 8–10-му ходу.
    - Развитие с темпом: ход, который развивает фигуру и создаёт угрозу.
    - Считайте темпы: кто сделал больше полезных ходов, тот впереди.
  typical_mistakes_ru:
    - Ранние выпады ферзём и погоня за пешками.
    - Много ходов пешками (a3, h3, b3) и отставание в развитии.
    - Затягивать рокировку ради атаки, которой ещё нет.
  lichess_themes: [opening]
  eco_codes: [C50, C53, D02]
  lesson_stems: [принцип, дебют, opening, развит]
  positions:
    - title_ru: Итальянская партия — классическое развитие
      moves: "1. e4 e5 2. Nf3 Nc6 3. Bc4 Bc5 4. c3 Nf6 5. d3 d6 6. O-O O-O"
      plan_ru: "Обе стороны заняли центр, вывели коней и слонов, рокировали. Дальше: белые — Nbd2, Re1, Bb3, d4; чёрные — ...a6, ...Ba7, ...h6, ...Re8."

- slug: king-safety-and-castling
  phase: opening
  level: 1
  title_ru: Безопасность короля и рокировка
  title_en: King safety and castling
  summary_ru: >-
    Рокировка уводит короля из центра, где в дебюте вскрываются линии, и включает ладью в
    игру. Рокируйте рано, обычно до 10-го хода, и не двигайте пешки перед королём без
    причины: каждая такая пешка — будущая слабость. Слабые поля f2/f7 до рокировки
    защищает только король, отсюда большинство дебютных ловушек.
  summary_en: Castle early, keep the pawns in front of the king, watch f2/f7.
  key_ideas_ru:
    - Рокировка — часть развития, а не «когда будет время».
    - Не ослабляйте поля перед королём: h3/h6 только против связки, g4/g5 — только с расчётом.
    - Выбирайте сторону рокировки по тому, где у соперника пешечный штурм.
  typical_mistakes_ru:
    - Оставлять короля в центре ради выигрыша пешки.
    - Рокировать «под атаку» — на фланг, где соперник уже двинул пешки.
  lichess_themes: [opening, kingsideAttack, exposedKing]
  lesson_stems: [рокировк, безопасн, king safety, castl]
  positions:
    - title_ru: Отражение раннего выпада ферзём
      moves: "1. e4 e5 2. Qh5 Nc6 3. Bc4 g6 4. Qf3 Nf6"
      plan_ru: "f7 защищено, фигуры чёрных развиты с темпом. Белые уже потеряли время ферзём; дальше ...Bg7, ...O-O и лучшая позиция у чёрных."

- slug: development-and-tempo
  phase: opening
  level: 2
  title_ru: Развитие и темп
  title_en: Development and tempo
  summary_ru: >-
    Темп — один полезный ход. Выигрыш темпа: развить фигуру с нападением, чтобы соперник
    отвечал вынужденно. Потеря темпа: ходить одной фигурой дважды, отступать ферзём,
    брать пешки на краю. Считайте развитые фигуры с обеих сторон: перевес в два-три темпа
    в открытой позиции — уже основание для атаки, а в закрытой почти не важен.
  summary_en: A tempo is one useful move; gain them by developing with threats, don't lose them chasing pawns.
  key_ideas_ru:
    - Развивайте с угрозой: Bb5 с давлением на c6, Nc3 с нападением на ферзя.
    - Ранний ферзь соперника — повод развивать фигуры, нападая на него.
    - В открытой позиции темпы важнее пешки.
  typical_mistakes_ru:
    - Отыгрывать пешку ценой трёх темпов.
    - Гонять чужого ферзя ходами пешек, которые ослабляют позицию.
  lichess_themes: [opening]
  eco_codes: [B01, C41]
  lesson_stems: [темп, tempo, развит]
  positions:
    - title_ru: Скандинавская — темпы против ферзя
      moves: "1. e4 d5 2. exd5 Qxd5 3. Nc3 Qa5 4. d4 Nf6 5. Nf3"
      plan_ru: "Белые вывели коня с нападением на ферзя и получили центр. Чёрные отдали темп, но структура крепкая: ...c6, ...Bf5, ...e6. Считайте: у белых три развитые фигуры, у чёрных две."

- slug: gambits
  phase: opening
  level: 2
  title_ru: Гамбиты
  title_en: Gambits
  summary_ru: >-
    Гамбит — жертва пешки (реже фигуры) в дебюте за развитие, центр или атаку. Принимать
    гамбит можно, если вы готовы вернуть пешку ради развития; удерживать материал любой
    ценой — самый частый способ проиграть. Отклонять гамбит — тоже стратегия: получить
    спокойную позицию без риска. Изучайте гамбиты ради понимания инициативы, а не как
    основной репертуар.
  summary_en: A pawn for development and initiative; take it only if you can give it back for development.
  key_ideas_ru:
    - Принял гамбит — развивайся и верни пешку вовремя.
    - Играешь гамбит — не дай сопернику консолидироваться: угрозы каждым ходом.
    - Оценивайте компенсацию через три фактора: развитие, центр, безопасность короля.
  typical_mistakes_ru:
    - Держать лишнюю пешку и отставать в развитии.
    - Жертвовать вторую пешку, когда за первую компенсации уже нет.
  lichess_themes: [opening, sacrifice]
  eco_codes: [C33, C52, D20, D08]
  lesson_stems: [гамбит, gambit]
  positions:
    - title_ru: Королевский гамбит
      moves: "1. e4 e5 2. f4 exf4 3. Nf3 d6"
      plan_ru: "Белые отдали пешку за центр (d4) и линию f. Чёрные держат f4 ходами ...g5 или возвращают пешку ради развития. Белые: Bc4, d4, O-O — и давление по f."

- slug: choosing-a-repertoire
  phase: opening
  level: 2
  title_ru: Как выбрать дебютный репертуар
  title_en: Choosing an opening repertoire
  summary_ru: >-
    Репертуар — небольшой набор дебютов, которые вы понимаете, а не помните. До 1500
    достаточно одного дебюта за белых (1.e4 или 1.d4) и по одному ответу на 1.e4 и 1.d4 за
    чёрных. Выбирайте по типу позиций, которые вам нравятся: открытые (Итальянская,
    Шотландская), закрытые (Лондонская, Каро-Канн), острые (Сицилианская, Староиндийская).
    Учите не варианты, а планы и типичные структуры; проверяйте репертуар разбором своих
    партий.
  summary_en: A few openings you understand beat many you memorise; pick them by the kind of positions you like.
  key_ideas_ru:
    - Один дебют за белых, по одному ответу на e4 и d4 за чёрных — до 1500 этого хватает.
    - Дебют выбирается по структуре и плану, а не по моде.
    - После каждой партии проверьте дебют по базе: где вы вышли из книги и почему.
  typical_mistakes_ru:
    - Менять дебют после каждого поражения.
    - Учить варианты на 20 ходов, не понимая планов.
  lichess_themes: [opening]
  eco_codes: [C50, B10, D02, B20, E60]
  lesson_stems: [репертуар, repertoire, выбор дебют]
