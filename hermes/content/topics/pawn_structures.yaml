# Тематическая база тренера — раздел «Пешечные структуры». Черновик 23.09.2026, правит методист.

- slug: isolated-queens-pawn
  aliases: ["изолятор", "изолированная пешка", "iqp", "изолированная пешка d"]
  phase: pawn_structure
  level: 3
  title_ru: Изолированная пешка d (IQP)
  title_en: Isolated queen's pawn
  summary_ru: >-
    Пешка d4 (d5) без соседей на линиях c и e. Она даёт пространство, форпост e5 (e4) и
    открытые линии для атаки на короля, но сама нуждается в защите фигурами и слабеет с
    каждым разменом. Сторона с изолятором играет на атаку в миттельшпиле и на прорыв d4–d5;
    сторона против — блокирует пешку конём на d5 (d4), меняет фигуры и переходит в эндшпиль.
  summary_en: A d-pawn with no neighbours — dynamic strength in the middlegame, a weakness in the endgame.
  key_ideas_ru:
    - С изолятором: фигуры на e5, слон на d3 (c2), ладьи на e1 и c1, прорыв d5 в нужный момент.
    - Против изолятора: блокада поля перед пешкой, размен лёгких фигур, давление по линии d.
    - Оценка меняется от количества фигур — чем их меньше, тем хуже изолятору.
  typical_mistakes_ru:
    - С изолятором соглашаться на размены без компенсации.
    - Против изолятора спешить его выиграть, пропуская атаку на короля.
  lichess_themes: [middlegame, endgame]
  eco_codes: [D34, D42, C09, B14]
  lesson_stems: [изолир, изолятор, isolated, iqp]
  positions:
    - title_ru: Изолятор чёрных в защите Тарраша
      moves: "1. d4 d5 2. c4 e6 3. Nc3 c5 4. cxd5 exd5 5. Nf3 Nc6 6. g3 Nf6 7. Bg2 Be7 8. O-O O-O 9. Bg5 cxd4 10. Nxd4"
      plan_ru: "У чёрных изолированная пешка d5, но свободная игра фигур: ...h6, ...Re8, ...Bg4, конь на e4. Белые давят на d5 (Bg2, Nd4, Rc1) и меняют фигуры."
  model_games:
    - {white: "Botvinnik", black: "Vidmar", year: 1936, note_ru: "Ноттингем: образец атаки с изолятором — прорыв d5 и удар на f7."}

- slug: hanging-pawns
  phase: pawn_structure
  level: 3
  title_ru: Висячие пешки
  title_en: Hanging pawns
  summary_ru: >-
    Две соседние пешки (обычно c5 и d5 у чёрных или c4 и d4 у белых) без опоры на соседних
    линиях. Они контролируют центр и грозят продвижением, но не защищены пешками и
    становятся мишенью, если одна из них вынужденно двигается. Сторона с висячими пешками
    играет активно и держит их рядом; сторона против — вынуждает одну пешку пойти вперёд и
    блокирует обе.
  summary_en: Two adjacent pawns without pawn support — strong while they stand together, weak once one advances.
  key_ideas_ru:
    - Висячие пешки сильны, пока стоят рядом; прорыв d4–d5 (…d5–d4) должен быть подготовлен.
    - Против них нападайте на одну пешку так, чтобы вторая осталась отсталой.
    - В эндшпиле висячие пешки почти всегда слабость.
  typical_mistakes_ru:
    - Двигать одну из пешек «от нападения» и получать изолированную пару.
    - Разменивать фигуры, имея висячие пешки, — их сила в фигурной игре.
  lichess_themes: [middlegame]
  eco_codes: [D58, D59, E14]
  lesson_stems: [висяч, hanging]
  positions:
    - title_ru: Висячие пешки чёрных из системы Тартаковера
      moves: "1. d4 Nf6 2. c4 e6 3. Nf3 d5 4. Nc3 Be7 5. Bg5 O-O 6. e3 h6 7. Bh4 b6 8. cxd5 Nxd5 9. Bxe7 Qxe7 10. Nxd5 exd5 11. Rc1 Be6 12. Qa4 c5 13. Qa3 Rc8 14. Bb5 a6 15. dxc5 bxc5"
      plan_ru: "Пешки c5 и d5 висячие. Белые давят на c5 (Qa3, Bb5–e2, Rc1) и ждут ...d4 или ...c4; чёрные ищут ...d4 с активностью или ...Qb7 и давление по линии b."
  model_games:
    - {white: "Fischer", black: "Spassky", year: 1972, note_ru: "Партия 6: белые вынуждают ослабление висячих пешек и решают партию давлением."}

- slug: doubled-pawns
  phase: pawn_structure
  level: 2
  title_ru: Сдвоенные пешки
  title_en: Doubled pawns
  summary_ru: >-
    Две пешки на одной линии после взятия. Минусы: они не защищают друг друга, дают меньше
    проходных, одна из них часто неподвижна. Плюсы: открытая соседняя линия для ладьи и
    контроль дополнительных полей в центре. Сдвоенные пешки — слабость в эндшпиле и
    приемлемая плата за пару слонов или линию в миттельшпиле.
  summary_en: "Two pawns on one file: a weakness in the endgame, often acceptable for an open file or the bishop pair."
  key_ideas_ru:
    - Сдвоенные изолированные пешки — серьёзная слабость; сдвоенные с соседкой — терпимая.
    - Используйте открытую линию, полученную вместе со сдвоением.
    - Против сдвоенных пешек стремитесь к эндшпилю и к блокаде передней пешки.
  typical_mistakes_ru:
    - Бить «на структуру» слоном, отдавая пару слонов без реальной выгоды.
    - Двигать переднюю сдвоенную пешку без поддержки — она станет изолированной.
  lichess_themes: [endgame, middlegame]
  eco_codes: [C68, E20]
  lesson_stems: [сдвоен, doubled]
  positions:
    - title_ru: Сдвоенные пешки c в разменной Испанской
      moves: "1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 4. Bxc6 dxc6 5. O-O"
      plan_ru: "Чёрные пешки c7 и c6 сдвоены: в пешечном эндшпиле белые создают проходную на королевском фланге (4 против 3), а чёрные не могут. Чёрным нужны фигуры и два слона."

- slug: backward-pawn
  phase: pawn_structure
  level: 2
  title_ru: Отсталая пешка
  title_en: Backward pawn
  summary_ru: >-
    Пешка, которая отстала от соседок и не может продвинуться без потери, а поле перед ней
    контролирует соперник. Двойная проблема: сама пешка слаба по полуоткрытой линии, а поле
    перед ней — форпост для фигуры соперника. Отсталую пешку либо продвигают при первой
    возможности, либо защищают фигурами и ищут контригру в другом месте.
  summary_en: A pawn left behind its neighbours; both the pawn and the square in front of it are weak.
  key_ideas_ru:
    - Поле перед отсталой пешкой — цель для коня.
    - Давите по полуоткрытой линии ладьями, не спешите брать пешку.
    - Сторона с отсталой пешкой должна готовить её продвижение (в Сицилианской — ...d5).
  typical_mistakes_ru:
    - Создавать отсталую пешку ходами вроде ...e5 без плана ...d5.
    - Допускать блокаду поля перед пешкой навсегда.
  lichess_themes: [middlegame]
  eco_codes: [B33, B92]
  lesson_stems: [отстал, backward]
  positions:
    - title_ru: Отсталая пешка d6 в Свешникове
      moves: "1. e4 c5 2. Nf3 Nc6 3. d4 cxd4 4. Nxd4 Nf6 5. Nc3 e5 6. Ndb5 d6"
      plan_ru: "Пешка d6 отстала, поле d5 — дыра. Чёрные компенсируют это активными фигурами и планом ...f5; белые ставят коня на d5 и давят по линии d."

- slug: passed-pawn
  phase: pawn_structure
  level: 1
  title_ru: Проходная пешка
  title_en: Passed pawn
  summary_ru: >-
    Пешка, перед которой и на соседних линиях нет чужих пешек. Её ценность растёт с каждым
    рангом и в эндшпиле часто решает партию. Проходную нужно поддерживать сзади ладьёй
    («ладья за проходной») и защищать королём; сопернику нужно её блокировать фигурой,
    лучше всего конём, на поле перед ней. Отдалённая проходная отвлекает чужого короля от
    другого фланга.
  summary_en: A pawn with no enemy pawns ahead on its own or adjacent files; it must be pushed — or blockaded.
  key_ideas_ru:
    - Ладьи ставятся за проходную — свою или чужую.
    - Блокируйте проходную фигурой на поле перед ней; конь-блокёр — лучший.
    - Защищённая проходная в пешечном эндшпиле почти всегда выигрывает.
  typical_mistakes_ru:
    - Двигать проходную без поддержки и потерять её.
    - Ставить ладью перед проходной вместо позиции сзади.
  lichess_themes: [advancedPawn, promotion, endgame]
  lesson_stems: [проходн, passed]
  positions:
    - title_ru: Ладья за проходной пешкой
      fen: "r5k1/5ppp/8/P7/8/8/5PPP/R5K1 w - - 0 1"
      plan_ru: "Белая ладья a1 стоит за проходной a5, чёрная ладья a8 — перед ней и обречена на пассивность. План белых: король идёт к пешке, a6, затем вторжение ладьи."
      best_move: a6

- slug: pawn-chain
  phase: pawn_structure
  level: 2
  title_ru: Пешечная цепь
  title_en: Pawn chain
  summary_ru: >-
    Диагональ пешек, где каждая защищает следующую (d4–e5 у белых против e6–d5 у чёрных во
    Французской). Цепь атакуют у основания: подрыв самой задней пешки (…c5 против d4,
    затем …f6 против e5) разрушает всю конструкцию. Сторона с цепью получает пространство
    и атаку на фланге, куда «смотрит» цепь; сторона против — игру по полуоткрытым линиям.
  summary_en: A diagonal of mutually protecting pawns; attack it at the base, play where it points.
  key_ideas_ru:
    - Атакуйте цепь у основания подрывом пешкой, а не фигурами.
    - Цепь показывает, где атаковать: белые в Французской играют на королевском фланге.
    - Не разменивайте головную пешку цепи без причины — она даёт пространство.
  typical_mistakes_ru:
    - Подрывать вершину цепи фигурами вместо основания пешкой.
    - Затягивать с ...c5 во Французской — без подрыва позиция чёрных пассивна.
  lichess_themes: [middlegame]
  eco_codes: [C02, C11, E90]
  lesson_stems: [цеп, chain]
  positions:
    - title_ru: Цепь d4–e5 против e6–d5 (Французская, атака основания)
      moves: "1. e4 e6 2. d4 d5 3. e5 c5 4. c3 Nc6 5. Nf3 Qb6"
      plan_ru: "Чёрные подрывают основание d4: ...c5, ...Qb6, ...Nc6, ...Nge7–f5. Белые держат d4 (c3, Be2, O-O) и играют на королевском фланге, куда направлена цепь."

- slug: minority-attack
  aliases: ["атака меньшинства", "пешечное меньшинство"]
  phase: pawn_structure
  level: 3
  title_ru: Атака пешечного меньшинства
  title_en: Minority attack
  summary_ru: >-
    В карлсбадской структуре (пешки белых a2, b2 против a7, b7, c6 чёрных на ферзевом
    фланге) белые двигают b4–b5, чтобы после bxc6 оставить чёрным слабую пешку c6 или
    отсталую пешку. Меньшинство пешек атакует большинство ради слабости, а не проходной.
    Чёрные в ответ играют на королевском фланге (…Ne4, …f5) или тормозят план ходом …a5.
  summary_en: In the Carlsbad structure White pushes b4–b5 to leave Black a weak pawn on c6.
  key_ideas_ru:
    - План белых: Rab1, b4, a4, b5 — и давление на c6 по линии c.
    - Чёрные отвечают либо ...a5 (b4 надо готовить), либо активной игрой в центре и на королевском фланге.
    - После bxc6 bxc6 слабость c6 фиксируется; после ...cxb5 у белых открытая линия b.
  typical_mistakes_ru:
    - Играть b4–b5 без подготовки, когда ...a5 или ...c5 сразу уравнивают.
    - Чёрным пассивно ждать вместо контригры на другом фланге.
  lichess_themes: [middlegame]
  eco_codes: [D35, D36]
  lesson_stems: [меньшинств, minority, карлсбад]
  positions:
    - title_ru: Карлсбадская структура из разменного ферзевого гамбита
      moves: "1. d4 d5 2. c4 e6 3. Nc3 Nf6 4. cxd5 exd5 5. Bg5 Be7 6. e3 O-O 7. Bd3 Nbd7 8. Qc2 c6 9. Nf3 Re8 10. O-O Nf8"
      plan_ru: "Классический план белых — атака меньшинства b4–b5; чёрные готовят ...Ne4, ...Ng6 и игру на королевском фланге."

- slug: pawn-majority
  phase: pawn_structure
  level: 2
  title_ru: Пешечное большинство
  title_en: Pawn majority
  summary_ru: >-
    Когда на одном фланге у стороны больше пешек, чем у соперника, она может создать там
    проходную. Здоровое большинство (без сдвоенных пешек) — долгосрочный плюс для эндшпиля;
    большинство на фланге, где нет королей, особенно ценно: проходная отвлечёт чужого
    короля. Двигайте большинство «ровной цепью», начиная с пешки-кандидата, у которой нет
    чужой пешки напротив.
  summary_en: More pawns on one wing means a future passed pawn; advance the candidate pawn first.
  key_ideas_ru:
    - Пешка-кандидат идёт первой, соседи её поддерживают.
    - Большинство на дальнем от королей фланге — козырь в эндшпиле.
    - Сдвоенные пешки обесценивают большинство: три пешки против двух могут не дать проходной.
  typical_mistakes_ru:
    - Двигать не ту пешку и застопорить большинство.
    - Меняться пешками так, что большинство исчезает.
  lichess_themes: [endgame, advancedPawn]
  eco_codes: [C68]
  lesson_stems: [большинств, majority]
  positions:
    - title_ru: Здоровое большинство белых на королевском фланге
      moves: "1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 4. Bxc6 dxc6 5. O-O f6 6. d4 exd4 7. Nxd4"
      plan_ru: "У белых 4 пешки против 3 на королевском фланге, у чёрных 4 против 3 на ферзевом, но со сдвоенной c. В эндшпиле белые получают проходную, чёрные — нет."
