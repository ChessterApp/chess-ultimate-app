# Hermes Chess Coach — Model Routing Configuration

# Models are OpenRouter ids. Prices live in src/model_prices.py — keep both in
# step. Any tier can be overridden without a deploy via COACH_MODEL_DEFAULT /
# COACH_MODEL_FAST / COACH_MODEL_ANALYSIS / COACH_MODEL_DEEP / COACH_MODEL_UTILITY.
#
# 2026-09-20: gemini-2.5-flash (previous fast/default) is retired by Google on
# 2026-10-16; claude-opus-4 ($15/$75) and claude-sonnet-4-5 ($3/$15) replaced by
# their current generations ($5/$25, $2/$10). Run `python -m src.eval.runner`
# against eval/golden before changing these again.
model:
  default: "google/gemini-3.8-flash"
  provider: "openrouter"
  context_length: 131072

# Model routing tiers (see src/model_router.py for what routes where)
# - fast:     general questions, explanations — most turns
# - analysis: position analysis, variations, tactics
# - deep:     game reviews, strategic plans, preparation
# - utility:  the coach's own housekeeping (best-of-N judge, memory writer,
#             playbook distiller) — never a student-facing answer
model_tiers:
  fast: "google/gemini-3.8-flash"
  analysis: "anthropic/claude-sonnet-5"
  deep: "anthropic/claude-opus-5"
  utility: "google/gemini-3.5-flash-lite"

terminal:
  backend: "local"
  cwd: "/root/hermes-chess"
  timeout: 180

provider_routing:
  sort: "throughput"
  data_collection: "deny"

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last: 20

# Server port for the chess coach API
port: 8642
