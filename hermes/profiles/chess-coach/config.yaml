# Hermes Chess Coach — Model Routing Configuration

# Models are OpenRouter ids. Prices live in src/model_prices.py — keep both in
# step. Any tier can be overridden without a deploy via COACH_MODEL_DEFAULT /
# COACH_MODEL_FAST / COACH_MODEL_ANALYSIS / COACH_MODEL_DEEP / COACH_MODEL_UTILITY.
#
# 2026-09-23 — decided on the live bench (AI_COACH_MODEL_BENCH_2026-09-23.md,
# eval/bench/2026-09-23*): DeepSeek V4.1 Flash for ordinary turns (engine called
# 75/75, ru/kk 107/107, ~$0.005/turn), Gemini 3.8 Flash for game reviews (71 s vs
# 405 s), vision and as the fallback when the primary provider fails. The tier is
# picked by request type (a PGN in the message → deep), not by keyword guessing.
# Run `python scripts/model_bench.py` before changing these again.
model:
  default: "deepseek/deepseek-v4.1-flash"
  provider: "openrouter"
  context_length: 131072

# Model routing tiers (see src/model_router.py for what routes where)
# - fast:     everything the student asks — positions, puzzles, openings, advice
# - analysis: same model as fast (kept as a tier so env overrides still work)
# - deep:     game reviews (PGN pasted / loaded) and preparation
# - utility:  the coach's own housekeeping (best-of-N judge, memory writer,
#             playbook distiller) — never a student-facing answer
# - fallback: used for a turn when the routed model's provider fails (429/5xx)
model_tiers:
  fast: "deepseek/deepseek-v4.1-flash"
  analysis: "deepseek/deepseek-v4.1-flash"
  deep: "google/gemini-3.8-flash"
  utility: "deepseek/deepseek-v4.1-flash"
  fallback: "google/gemini-3.8-flash"

terminal:
  backend: "local"
  cwd: "/root/hermes-chess"
  timeout: 180

provider_routing:
  sort: "throughput"
  data_collection: "deny"

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last: 20

# Server port for the chess coach API
port: 8642
