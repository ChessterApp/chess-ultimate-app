name: hermes-eval

# Engine-grounded regression gate (Phase 0, Task E). Only fires when the coach's
# prompt source changes — a prompt edit must be accompanied by a deliberate
# re-baseline of the frozen golden set, or the engine-correctness gate fails.
on:
  push:
    paths:
      - hermes/profiles/chess-coach/SOUL.md
      - hermes/profiles/chess-coach/config.yaml
      - hermes/src/prompt_builder.py
  pull_request:
    paths:
      - hermes/profiles/chess-coach/SOUL.md
      - hermes/profiles/chess-coach/config.yaml
      - hermes/src/prompt_builder.py

jobs:
  engine-correctness-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned, as in tests.yml: the gate scores committed answers against the engine, so the score moves with the
      # engine version. The apt package followed the runner image and the gate failed 28.10 with no code change
      # (0.8284 in CI, the same commits 0.8198 on Stockfish 19 locally; the last green run was 21.10).
      - name: Install Stockfish
        env:
          STOCKFISH_VERSION: sf_19
          STOCKFISH_SHA256: 9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f
        run: |
          curl -sSfL -o /tmp/sf.tar.gz \
            "https://github.com/official-stockfish/Stockfish/releases/download/${STOCKFISH_VERSION}/stockfish-linux-x86-64-universal.tar.gz"
          echo "${STOCKFISH_SHA256}  /tmp/sf.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sf.tar.gz -C /tmp
          sudo install -m 755 /tmp/stockfish/stockfish-linux-x86-64-universal /usr/local/bin/stockfish
          echo quit | /usr/local/bin/stockfish | head -1

      - name: Install Python deps
        run: pip install "chess>=1.10"

      - name: Run engine-correctness regression gate
        env:
          STOCKFISH_PATH: /usr/local/bin/stockfish
        run: python scripts/ci_eval_gate.py --dataset eval/datasets/golden_v1.jsonl --baseline eval/baselines/golden_v1.baseline.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: hermes/eval_report.json
